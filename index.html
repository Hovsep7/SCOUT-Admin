function bindTimelineDrag(){
  const timeline = document.getElementById("timelineEl");
  if(!timeline) return;
  timeline.querySelectorAll(".tl-block").forEach(blockEl=>{
    const blockId = blockEl.dataset.block;
    blockEl.addEventListener("click", (e)=>{
      if(drag && drag.moved) return; // suppress click after a real drag
      if(e.target.classList.contains("tl-resize")) return;
      if(e.target.closest(".tl-select-toggle")) return; // the toggle button handles its own click
      if(e.shiftKey || e.ctrlKey || e.metaKey){ toggleBlockSelection(blockId); return; }
      openBlockModal(blockId);
    });
    blockEl.addEventListener("pointerdown", (e)=>{
      if(e.target.classList.contains("tl-resize")) return;
      if(e.target.closest(".tl-select-toggle")) return;
      e.preventDefault();
      const b = scheduleBlocks[blockId]; if(!b) return;
      // Dragging a block that's part of a larger selection moves the whole
      // group together, keeping every member's position relative to the one
      // being dragged -- see the group-clamping comment in
      // onTimelinePointerMove for how their shared bounds are enforced.
      const isGroupDrag = selectedBlockIds.has(blockId) && selectedBlockIds.size > 1;
      const group = isGroupDrag ? Array.from(selectedBlockIds).map(id=>{
        const gb = scheduleBlocks[id];
        return gb ? {id, originStart: gb.startMin, durationMin: gb.durationMin} : null;
      }).filter(Boolean) : null;
      drag = { mode:"move", blockId, startY: e.clientY, originStart: b.startMin, moved:false, group };
      blockEl.setPointerCapture(e.pointerId);
      blockEl.classList.add("dragging");
    });
    const resizeHandle = blockEl.querySelector(".tl-resize");
    if(resizeHandle){
      resizeHandle.addEventListener("pointerdown", (e)=>{
        e.preventDefault(); e.stopPropagation();
        const b = scheduleBlocks[blockId]; if(!b) return;
        drag = { mode:"resize", blockId, startY: e.clientY, originDuration: b.durationMin, moved:false };
        resizeHandle.setPointerCapture(e.pointerId);
      });
    }
  });
  timeline.addEventListener("pointerdown", (e)=>{
    if(drag) return;
    if(e.target.closest(".tl-block")) return;
    const rect = timeline.getBoundingClientRect();
    const rawStart = DAY_START + ((e.clientY - rect.top) / PX_PER_MIN);
    const createStart = Math.max(DAY_START, Math.min(DAY_END-5, Math.round(rawStart/5)*5));
    /* Touch is deliberately NOT hijacked into a drag here: on a touchscreen
       this is also the only way to scroll the timeline, so treating a touch
       drag as "create a block" would trap anyone below the visible fold with
       no way to scroll down to the rest of the day. Instead a plain tap
       (below) opens the add-block modal pre-filled with the tapped time --
       the same pattern Google Calendar's mobile web view uses. Mouse/pen
       input has no such conflict (wheel/trackpad scrolling is separate from
       a click-drag), so desktop keeps the original drag-to-set-duration. */
    if(e.pointerType === "touch"){
      pendingTouchTapStart = createStart;
      return;
    }
    e.preventDefault();
    drag = { mode:"create", startY: e.clientY, createStart, moved:false };
    timeline.setPointerCapture(e.pointerId);
  });
  timeline.addEventListener("click", (e)=>{
    if(e.target.closest(".tl-block")) return;
    if(pendingTouchTapStart == null) return;
    const start = pendingTouchTapStart;
    pendingTouchTapStart = null;
    openAddBlockModalAt(start);
  });
  /* Drag a source chip from the sidebar straight onto the timeline to drop it
     at that time, instead of it always landing after the last existing block. */
  document.querySelectorAll(".source-chip[draggable]").forEach(chip=>{
    chip.addEventListener("dragstart", (e)=>{
      e.dataTransfer.effectAllowed = "copy";
      e.dataTransfer.setData("text/plain", JSON.stringify({kind: chip.dataset.kind, source: chip.dataset.source}));
      chip.classList.add("chip-dragging");
    });
    chip.addEventListener("dragend", ()=> chip.classList.remove("chip-dragging"));
  });
  function minsFromClientY(clientY){
    const rect = timeline.getBoundingClientRect();
    return DAY_START + ((clientY - rect.top) / PX_PER_MIN);
  }
  function dropIndicatorEl(){
    let el = timeline.querySelector(".tl-drop-indicator");
    if(!el){ el = document.createElement("div"); el.className = "tl-drop-indicator"; timeline.appendChild(el); }
    return el;
  }
  timeline.addEventListener("dragover", (e)=>{
    e.preventDefault();
    e.dataTransfer.dropEffect = "copy";
    const mins = Math.round(minsFromClientY(e.clientY)/5)*5;
    const clamped = Math.max(DAY_START, Math.min(DAY_END-30, mins));
    const ind = dropIndicatorEl();
    ind.style.top = ((clamped-DAY_START)*PX_PER_MIN) + "px";
    ind.classList.add("visible");
  });
  timeline.addEventListener("dragleave", (e)=>{
    if(e.target===timeline){ const ind = timeline.querySelector(".tl-drop-indicator"); if(ind) ind.classList.remove("visible"); }
  });
  timeline.addEventListener("drop", (e)=>{
    e.preventDefault();
    const ind = timeline.querySelector(".tl-drop-indicator"); if(ind) ind.classList.remove("visible");
    let data;
    try{ data = JSON.parse(e.dataTransfer.getData("text/plain")); }catch(err){ return; }
    if(!data || !data.kind || !data.source) return;
    addBlockFromSource(data.kind, data.source, minsFromClientY(e.clientY));
  });

  timeline.addEventListener("pointermove", onTimelinePointerMove);
  timeline.addEventListener("pointerup", onTimelinePointerUp);
  timeline.addEventListener("pointercancel", onTimelinePointerUp);
}
function onTimelinePointerMove(e){
  if(!drag) return;
  const deltaY = e.clientY - drag.startY;
  if(Math.abs(deltaY) > 3) drag.moved = true;
  const deltaMin = Math.round((deltaY / PX_PER_MIN) / 5) * 5;
  if(drag.mode==="create"){
    const timeline = document.getElementById("timelineEl");
    if(!timeline) return;
    const dur = Math.max(5, Math.min(DAY_END-drag.createStart, deltaMin));
    let ghost = timeline.querySelector(".tl-create-ghost");
    if(!ghost){ ghost = document.createElement("div"); ghost.className = "tl-create-ghost"; timeline.appendChild(ghost); }
    ghost.style.top = ((drag.createStart-DAY_START)*PX_PER_MIN) + "px";
    ghost.style.height = Math.max(18, dur*PX_PER_MIN) + "px";
    ghost.textContent = minLabel(drag.createStart) + "–" + minLabel(drag.createStart+dur);
    drag.pendingDuration = dur;
    return;
  }
  const blockEl = document.querySelector('.tl-block[data-block="'+drag.blockId+'"]');
  const b = scheduleBlocks[drag.blockId];
  if(!blockEl || !b) return;
  if(drag.mode==="move" && drag.group){
    // Clamp the group's SHARED delta so every member stays in-bounds together --
    // without this, the member closest to a boundary would stop early while the
    // rest kept moving, breaking the selection's relative positions apart.
    let minDelta = -Infinity, maxDelta = Infinity;
    drag.group.forEach(g=>{
      minDelta = Math.max(minDelta, DAY_START - g.originStart);
      maxDelta = Math.min(maxDelta, DAY_END - g.durationMin - g.originStart);
    });
    const effectiveDelta = Math.max(minDelta, Math.min(maxDelta, deltaMin));
    drag.pendingGroup = {};
    drag.group.forEach(g=>{
      const gStart = g.originStart + effectiveDelta;
      const gEl = document.querySelector('.tl-block[data-block="'+g.id+'"]');
      if(gEl) gEl.style.top = ((gStart-DAY_START)*PX_PER_MIN) + "px";
      drag.pendingGroup[g.id] = gStart;
    });
    drag.pendingStart = drag.pendingGroup[drag.blockId];
  } else if(drag.mode==="move"){
    let newStart = drag.originStart + deltaMin;
    newStart = Math.max(DAY_START, Math.min(DAY_END-b.durationMin, newStart));
    blockEl.style.top = ((newStart-DAY_START)*PX_PER_MIN) + "px";
    drag.pendingStart = newStart;
  } else {
    let newDur = Math.max(5, Math.min(DAY_END-b.startMin, drag.originDuration + deltaMin));
    blockEl.style.height = Math.max(18, newDur*PX_PER_MIN) + "px";
    drag.pendingDuration = newDur;
  }
}
function onTimelinePointerUp(e){
  if(!drag) return;
  if(drag.mode==="create"){
    const timeline = document.getElementById("timelineEl");
    const ghost = timeline && timeline.querySelector(".tl-create-ghost");
    if(ghost) ghost.remove();
    const moved = drag.moved, createStart = drag.createStart, pendingDuration = drag.pendingDuration;
    drag = null;
    if(moved && pendingDuration){
      const id = addCustomBlockAt(createStart, pendingDuration);
      if(id){ render(); openBlockModal(id); }
    }
    return;
  }
  const blockEl = document.querySelector('.tl-block[data-block="'+drag.blockId+'"]');
  if(blockEl) blockEl.classList.remove("dragging");
  if(drag.moved){
    if(drag.mode==="move" && drag.pendingGroup){
      Object.keys(drag.pendingGroup).forEach(id=> mergeDoc("scheduleBlocks", id, {startMin: drag.pendingGroup[id]}));
    }
    else if(drag.mode==="move" && drag.pendingStart!=null){ mergeDoc("scheduleBlocks", drag.blockId, {startMin: drag.pendingStart}); }
    else if(drag.mode==="resize" && drag.pendingDuration!=null){ mergeDoc("scheduleBlocks", drag.blockId, {durationMin: drag.pendingDuration}); }
  }
  const wasMoved = drag.moved;
  if(!wasMoved){ drag = null; }
  else { setTimeout(()=>{ drag = null; }, 50); }
}

/* =========================== EXPANDED COLOR PICKER =========================== */
/* Shared by the patrol, category and schedule-block modals: a wider preset
   palette (CATEGORY_SWATCHES) plus a live custom-color swatch (a native
   <input type="color">, so it opens the OS/browser color wheel) and a hex
   text field kept in sync with it -- so any exact color is reachable, not
   just the presets. */
function colorPickerHtml(idPrefix, current){
  const cur = current || CATEGORY_SWATCHES[0];
  return `
  <div class="color-picker" id="${idPrefix}Picker">
    <div class="swatches">
      ${CATEGORY_SWATCHES.map(c=>`<button type="button" class="swatch ${cur.toLowerCase()===c.toLowerCase()?"selected":""}" data-color="${c}" style="background:${c}" title="${c}"></button>`).join("")}
      <label class="color-custom-swatch" title="${esc(t('customColor'))}">
        <input type="color" class="color-custom-input" value="${/^#[0-9a-fA-F]{6}$/.test(cur)?cur:"#888888"}" />
      </label>
    </div>
    <input type="text" class="hex-input" value="${esc(cur)}" placeholder="#RRGGBB" maxlength="7" />
  </div>`;
}
function wireColorPicker(root, idPrefix, initial, onChange){
  let sel = initial || CATEGORY_SWATCHES[0];
  const wrap = root.querySelector("#"+idPrefix+"Picker");
  if(!wrap) return { get: ()=>sel };
  const hexInput = wrap.querySelector(".hex-input");
  const colorInput = wrap.querySelector(".color-custom-input");
  const customSwatch = wrap.querySelector(".color-custom-swatch");
  function setSelected(color, opts){
    opts = opts || {};
    sel = color;
    onChange(color);
    wrap.querySelectorAll(".swatch").forEach(sw=> sw.classList.toggle("selected", sw.dataset.color.toLowerCase()===color.toLowerCase()));
    const isPreset = CATEGORY_SWATCHES.some(c=>c.toLowerCase()===color.toLowerCase());
    customSwatch.classList.toggle("selected", !isPreset);
    if(!opts.fromHex) hexInput.value = color;
    if(!opts.fromCustom && /^#[0-9a-fA-F]{6}$/.test(color)) colorInput.value = color;
  }
  wrap.querySelectorAll(".swatch").forEach(sw=> sw.addEventListener("click", ()=> setSelected(sw.dataset.color)));
  colorInput.addEventListener("input", (e)=> setSelected(e.target.value, {fromCustom:true}));
  hexInput.addEventListener("change", (e)=>{
    let v = e.target.value.trim();
    if(v && !v.startsWith("#")) v = "#"+v;
    if(/^#[0-9a-fA-F]{6}$/.test(v)) setSelected(v, {fromHex:true});
    else e.target.value = sel;
  });
  return { get: ()=> sel };
}

      const list = sortedPatrols();
      const nextOrder = list.length ? Math.max(...list.map(x=>x.order||0))+1 : 1;

    const label = document.getElementById("attachLabelInput").value.trim();
    const collection = kind==="topic" ? "topics" : "catItems";
    const store = kind==="topic" ? topics : catItems;

    const list = Array.isArray(item.attachments) ? item.attachments.slice() : [];

    render();
  });

/* The sticky header (.hdr) is a static element in the page skeleton -- only
   its innerHTML (#hdrInner) gets rebuilt on every render() -- so a single
   scroll listener set up once here is enough to toggle its "scrolled" shadow
   for the whole session, rather than re-attaching it on every render. */
function initHeaderScrollShadow(){
  const hdr = document.querySelector(".hdr");
  if(!hdr) return;
  const update = ()=> hdr.classList.toggle("scrolled", window.scrollY > 4);
  window.addEventListener("scroll", update, {passive:true});
  update();
}

/* =========================== KEYBOARD SHORTCUTS =========================== */
/* Desktop-only in practice (nothing here fires from a touch tap): number keys
   jump straight to a tab, [ / ] step to the previous/next one, Delete removes
   whatever schedule blocks are multi-selected, and ? opens a cheat-sheet of
   all of this so none of it depends on being memorized or discovered by
   accident. Escape is handled first and unconditionally so it always has a
   way to back out, even while a text field has focus. */
const VIEW_ORDER = ["roster","curriculum","schedule","attendance","patrols","dashboard"];
let shortcutsOverlayOpen = false;
function isTypingTarget(el){
  if(!el) return false;
  const tag = el.tagName;
  return tag==="INPUT" || tag==="TEXTAREA" || tag==="SELECT" || el.isContentEditable;
}
function modalIsOpen(){
  // #modalRoot permanently carries the "modal-backdrop" class as part of its
  // own hidden/visible toggle, so it has to be excluded explicitly here --
  // otherwise it would always match and this would report a modal open even
  // when nothing is. confirmAction()'s ad-hoc dialogs use the same class name
  // on a *different*, freshly-created element, which is what ":not(#modalRoot)"
  // is actually meant to catch.
  const root = document.getElementById("modalRoot");
  const hasMainModal = !!(root && !root.classList.contains("hidden") && root.innerHTML.trim());
  const hasConfirmDialog = !!document.querySelector(".modal-backdrop:not(#modalRoot)");
  return hasMainModal || hasConfirmDialog;
}
function initKeyboardShortcuts(){
  window.addEventListener("keydown", (e)=>{
    if(e.key === "Escape"){
      if(shortcutsOverlayOpen){ closeShortcutsOverlay(); return; }
      const confirmBackdrop = document.querySelector(".modal-backdrop:not(#modalRoot)");
      if(confirmBackdrop){ confirmBackdrop.remove(); return; }
      if(modalIsOpen()){ closeModal(); return; }
      if(selectedBlockIds.size){ clearBlockSelection(); return; }
      return;
    }
    if(e.key === "?"){
      if(isTypingTarget(e.target)) return; // let "?" still be typed into a text field
      e.preventDefault();
      shortcutsOverlayOpen ? closeShortcutsOverlay() : openShortcutsOverlay();
      return;
    }
    if(isTypingTarget(e.target)) return;
    if(shortcutsOverlayOpen || modalIsOpen()) return;
    if(e.key >= "1" && e.key <= "6" && !e.ctrlKey && !e.metaKey && !e.altKey){
      const target = VIEW_ORDER[Number(e.key)-1];
      if(target){ e.preventDefault(); view = target; render(); }
      return;
    }
    if((e.key === "[" || e.key === "]") && !e.ctrlKey && !e.metaKey && !e.altKey){
      e.preventDefault();
      const curIdx = Math.max(0, VIEW_ORDER.indexOf(view));
      const nextIdx = (curIdx + (e.key==="]"?1:-1) + VIEW_ORDER.length) % VIEW_ORDER.length;
      view = VIEW_ORDER[nextIdx]; render();
      return;
    }
    if((e.key === "Delete" || e.key === "Backspace") && view==="schedule" && selectedBlockIds.size){
      e.preventDefault();
      bulkDeleteBlocks();
      return;
    }
  });
}
function openShortcutsOverlay(){
  if(shortcutsOverlayOpen) return;
  shortcutsOverlayOpen = true;
  const root = document.createElement("div");
  root.className = "kbd-overlay";
  root.id = "kbdOverlay";
  const rows = [
    ["1", "6", "kbdRowTabs"],
    ["[", "]", "kbdRowPrevNextTab"],
    ["Delete", null, "kbdRowDeleteSelected"],
    ["Esc", null, "kbdRowCloseEscape"],
    ["?", null, "kbdRowShowThis"],
  ];
  root.innerHTML = `
  <div class="kbd-panel">
    <h3>${esc(t("keyboardShortcuts"))}</h3>
    ${rows.map(([k1,k2,labelKey])=>`
    <div class="kbd-row">
      <span>${esc(t(labelKey))}</span>
      <div class="kbd-keys"><span class="kbd-key">${esc(k1)}</span>${k2?`<span class="kbd-key">${esc(k2)}</span>`:""}</div>
    </div>`).join("")}
    <div class="kbd-close-hint">${esc(t("kbdCloseHint"))}</div>
  </div>`;
  document.body.appendChild(root);
  root.addEventListener("click", (e)=>{ if(e.target===root) closeShortcutsOverlay(); });
}
function closeShortcutsOverlay(){
  shortcutsOverlayOpen = false;
  const root = document.getElementById("kbdOverlay");
  if(root) root.remove();
}
initKeyboardShortcuts();

     function initScrollProgress(){
  const fill = document.getElementById("scrollProgressFill");
  if(!fill) return;
  const update = ()=>{
    const doc = document.documentElement;
    const max = doc.scrollHeight - doc.clientHeight;
    fill.style.width = (max > 0 ? (window.scrollY / max) * 100 : 0) + "%";
  };
  window.addEventListener("scroll", update, {passive:true});
  window.addEventListener("resize", update, {passive:true});
  update();
}
initScrollProgress();
     
/* Best-effort only: lets the app shell (this page's own HTML/CSS/JS) load
   instantly, and even offline, on a repeat visit -- it does nothing for the
   live roster/attendance data itself, which still needs a connection to
   reach window.claude's db. Wrapped in try/catch and a feature check since
   a sandboxed context can refuse service-worker registration outright; if
   that happens the app just runs exactly as it did before, online-only. */
function initServiceWorker(){
  if(!("serviceWorker" in navigator)) return;
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
initServiceWorker();

/* Lightweight, client-side-only gate: not real security (Firestore rules
   remain the actual access control -- see firestore.rules/SETUP.md), just a
   speed bump so a casually-shared link doesn't land a stranger straight in
   the roster. Passphrase lives in this file; anyone editing the source can
   read or change it. */
const GATE_PASSPHRASE = "Daniel";
function gatePassed(){
  try{ return localStorage.getItem("scout_gate_ok") === "1"; }catch(e){ return false; }
}
function setGatePassed(){
  try{ localStorage.setItem("scout_gate_ok", "1"); }catch(e){}
}
function showGate(){
  const gate = document.getElementById("gateOverlay");
  if(!gate) { init(); return; }
  document.getElementById("gateTitleText").textContent = t("gateTitle");
  document.getElementById("gateSubtitleText").textContent = t("gateSubtitle");
  document.getElementById("gatePassInput").placeholder = t("gatePlaceholder");
  document.getElementById("gateBtn").textContent = t("gateButton");
  document.getElementById("gateError").textContent = t("gateError");
  gate.classList.remove("hidden");
  const input = document.getElementById("gatePassInput");
  const err = document.getElementById("gateError");
  setTimeout(()=> input.focus(), 60);
  document.getElementById("gateForm").addEventListener("submit", (e)=>{
    e.preventDefault();
    if(input.value === GATE_PASSPHRASE){
      setGatePassed();
      gate.classList.add("hidden");
      init();
    } else {
      err.classList.remove("hidden");
      input.value = "";
      input.focus();
    }
  });
}
if(gatePassed()){ init(); } else { showGate(); }
})();
