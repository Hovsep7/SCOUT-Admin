<!doctype html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCOUT</title>
<!-- ---- installable as a home-screen app ----
     manifest.json + icons are published as sibling files alongside this
     page; a scout leader at camp with spotty signal can add this to their
     phone's home screen and open it like a native app (standalone window,
     no browser chrome, its own icon). The service worker registered near
     the bottom of the script is a best-effort addition on top of this --
     it only lets the app SHELL load instantly/offline on a repeat visit;
     the live roster/attendance data still needs a connection either way. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0C3953">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SCOUT">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- A plain "Create shortcut" (as opposed to a full manifest-driven
     "Install app") falls back to the page's own favicon rather than the
     manifest's icons on many Android/Chrome versions -- without one, that
     path was defaulting to a generic icon. -->
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{
  --bg:#E8E5E2; --panel:#ffffff; --panel-2:#f2efea; --panel-3:#e9e5df;
  --ink:#16303f; --ink-dim:#5c6b73; --line:#d7d2c8;
  --navy:#0C3953; --navy-ink:#ffffff; --gold:#E2811A; --gold-ink:#3a2400;
  --st-none:#B7B7B7; --st-weak:#D61616; --st-prog:#E2811A; --st-done:#108210;
  --shadow:0 1px 2px rgba(12,20,25,.06),0 8px 24px rgba(12,20,25,.08);
  --radius:14px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f181e; --panel:#172530; --panel-2:#1e2f3a; --panel-3:#243947;
    --ink:#e9eef0; --ink-dim:#93a5ac; --line:#2c414d;
    --navy:#0C3953; --navy-ink:#ffffff; --gold:#f0983c; --gold-ink:#2e1700;
    --st-none:#8b9095; --st-weak:#e5695a; --st-prog:#f0983c; --st-done:#3fae63;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f181e; --panel:#172530; --panel-2:#1e2f3a; --panel-3:#243947;
  --ink:#e9eef0; --ink-dim:#93a5ac; --line:#2c414d;
  --navy:#0C3953; --navy-ink:#ffffff; --gold:#f0983c; --gold-ink:#2e1700;
  --st-none:#8b9095; --st-weak:#e5695a; --st-prog:#f0983c; --st-done:#3fae63;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.4);
}
/* ---- display density ----
   Nearly every font-size in this stylesheet is written in rem, so scaling
   the root font-size scales all of that text uniformly for free. The handful
   of rules below on top of that tighten (compact) or loosen (large) the
   fixed-px padding/gap on the most repeated list/card containers, so density
   visibly changes list length and touch-target size too, not just text. */
:root[data-density="compact"]{ font-size:14px; }
:root[data-density="large"]{ font-size:18.5px; }
:root[data-density="compact"] .scout-card{ padding:9px 10px 9px 9px; gap:6px; }
:root[data-density="compact"] .curr-card{ padding:8px; gap:4px; }
:root[data-density="compact"] .att-row{ padding:6px 10px; gap:8px; }
:root[data-density="compact"] .topic-row{ padding:6px 0; gap:8px; }
:root[data-density="compact"] .leaderboard-row{ padding:4px 0; gap:8px; }
:root[data-density="compact"] .sched-list-row{ padding:6px 6px; gap:8px; }
:root[data-density="large"] .scout-card{ padding:18px 18px 18px 16px; gap:13px; }
:root[data-density="large"] .curr-card{ padding:16px; gap:9px; }
:root[data-density="large"] .att-row{ padding:13px 16px; gap:12px; }
:root[data-density="large"] .topic-row{ padding:13px 0; gap:12px; }
:root[data-density="large"] .leaderboard-row{ padding:10px 0; gap:12px; }
:root[data-density="large"] .sched-list-row{ padding:12px 8px; gap:12px; }
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); margin:0;
  font-family:"Noto Sans Armenian","Noto Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
a{color:inherit}
h1,h2,h3{margin:0}
button{font-family:inherit}
.hidden{display:none!important}
.wrap{max-width:1180px; margin:0 auto; padding:0 16px 56px}
#app.view-fade{animation:view-fade-in .22s ease}
@keyframes view-fade-in{ from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:translateY(0)} }
.sched-side, .timeline-scroll, .dash-activity-list{scrollbar-width:thin}
.sched-side::-webkit-scrollbar, .timeline-scroll::-webkit-scrollbar, .dash-activity-list::-webkit-scrollbar{width:8px}
.sched-side::-webkit-scrollbar-thumb, .timeline-scroll::-webkit-scrollbar-thumb, .dash-activity-list::-webkit-scrollbar-thumb{
  background:var(--panel-3); border-radius:8px;
}

/* ---- header ----
   transform:translateZ(0) promotes the sticky, blurred header to its own
   compositing layer -- Chrome is known to flicker/repaint a
   position:sticky element that also carries backdrop-filter, especially
   while the page scrolls, unless it's forced onto its own layer this way. */
.hdr{
  background:rgba(12,57,83,.94); color:var(--navy-ink); position:sticky; top:0; overflow:hidden;
  margin-bottom:20px; z-index:40; backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
  box-shadow:0 0 0 rgba(0,0,0,0); transition:box-shadow .3s ease;
  transform:translateZ(0); will-change:transform;
}
.hdr.scrolled{ box-shadow:0 10px 26px rgba(6,20,28,.35); }
.hdr-inner{
  position:relative; max-width:1180px; margin:0 auto; padding:18px 16px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.hdr-logo{flex:none; width:34px; height:auto; color:#fff}
.hdr-logo svg{display:block; width:100%; height:auto}
.hdr-brand{flex:1; min-width:180px}
.hdr-brand h1{font-size:1.25rem; font-weight:700; letter-spacing:-0.01em; line-height:1.2}
.hdr-brand .sub{font-size:.8rem; opacity:.78; margin-top:2px}
.hdr-controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.lang-switch{display:flex; border-radius:999px; background:rgba(255,255,255,.12); padding:3px; position:relative}
.lang-switch .thumb{
  position:absolute; top:3px; bottom:3px; left:3px; border-radius:999px; background:var(--gold); z-index:0;
  transition:left .3s cubic-bezier(.16,.84,.44,1), width .3s cubic-bezier(.16,.84,.44,1);
}
.lang-switch button{
  border:none; background:transparent; padding:6px 14px; font-size:.8rem; font-weight:700;
  color:rgba(255,255,255,.75); cursor:pointer; border-radius:999px; position:relative; z-index:1;
  transition:color .2s ease;
}
.lang-switch button.active{color:var(--gold-ink)}
.theme-toggle{
  border:none; background:rgba(255,255,255,.12); color:#fff; width:34px; height:34px; border-radius:50%;
  cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center;
  transition:background .2s ease, transform .15s ease;
}
.theme-toggle:hover{background:rgba(255,255,255,.22); transform:translateY(-1px) rotate(8deg)}
.editor-name{display:flex; align-items:center; gap:6px}
.editor-name input{
  width:120px; font-size:.78rem; padding:6px 10px; border:none; border-radius:999px;
  background:rgba(255,255,255,.14); color:#fff;
}
.editor-name input::placeholder{color:rgba(255,255,255,.6)}
.editor-name label{font-size:.72rem; color:rgba(255,255,255,.68)}

.banner{
  display:flex; gap:10px; align-items:flex-start; padding:10px 14px; border-radius:10px;
  background:var(--st-prog); color:var(--gold-ink); font-size:.85rem; margin-bottom:16px;
}
.banner.err{background:var(--st-weak); color:#fff}

/* ---- tabs (now a sub-header strip nested inside the sticky .hdr, rather
   than a row of pill buttons in the page body -- see .hdr-tabs below) ---- */
.hdr-tabs{
  position:relative; overflow-x:auto; scrollbar-width:none;
  background:rgba(6,26,38,.55); border-top:1px solid rgba(255,255,255,.08);
}
.hdr-tabs::-webkit-scrollbar{display:none}
.hdr-tabs-inner{
  position:relative; max-width:1180px; margin:0 auto; padding:0 16px;
  display:flex; align-items:center; min-width:max-content;
}
.hdr-tab-btn{
  border:none; background:transparent; cursor:pointer; white-space:nowrap; position:relative;
  padding:12px 16px; font-size:.85rem; font-weight:700; letter-spacing:.01em;
  color:rgba(255,255,255,.6); transition:color .2s ease;
}
.hdr-tab-btn:hover{color:rgba(255,255,255,.9)}
.hdr-tab-btn.active{color:#fff}
.hdr-tabs-line{position:absolute; left:0; right:0; bottom:0; height:2px; background:rgba(255,255,255,.1)}
.hdr-tabs-fill{
  position:absolute; left:0; bottom:0; height:2px; background:var(--gold);
  transition:left .3s cubic-bezier(.16,.84,.44,1), width .3s cubic-bezier(.16,.84,.44,1);
}

     /* ---- scroll progress + branded scrollbar ---- */
.scroll-progress{ position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(255,255,255,.08); overflow:hidden; }
.scroll-progress span{ display:block; height:100%; width:0%; background:var(--gold); transition:width .08s linear; }

html{ scrollbar-width:thin; scrollbar-color:var(--gold) transparent; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--gold); border-radius:999px; border:2px solid var(--bg); background-clip:padding-box; }
::-webkit-scrollbar-thumb:hover{ background:var(--st-prog); }
     
@media (max-width:600px){
  .hdr-inner{ padding:10px 12px; gap:10px; }
  .hdr-logo{ width:26px; }
  .hdr-brand{ min-width:0; }
  .hdr-brand h1{ font-size:1rem; }
  .hdr-brand .sub{ display:none; }        /* drop the subtitle line on phones */
  .hdr-controls{ gap:6px; }
  .editor-name label{ display:none; }     /* keep just the input, not its label */
  .editor-name input{ width:84px; font-size:.72rem; padding:5px 8px; }
  .theme-toggle{ width:28px; height:28px; font-size:.85rem; }
  .lang-switch button{ padding:5px 10px; font-size:.72rem; }
  .hdr-tabs-inner{ padding:0 12px; }
  .hdr-tab-btn{ padding:9px 12px; font-size:.78rem; }
}
     
/* ---- toolbar / generic controls ---- */
.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px}
.toolbar input[type="text"], .toolbar select, .toolbar input[type="date"]{
  border:none; background:var(--panel); color:var(--ink); border-radius:10px;
  padding:9px 12px; font-size:.88rem; box-shadow:var(--shadow);
}
.toolbar input[type="text"]{flex:1; min-width:160px}
.date-nav{display:flex; gap:6px; align-items:center}
.date-nav .btn.small{padding:5px 11px; font-size:.95rem; line-height:1}
.date-nav .btn.small:disabled{opacity:.35; cursor:default; box-shadow:none}
.date-nav select{max-width:190px}
.btn{
  border:none; background:var(--panel); color:var(--ink); border-radius:10px;
  padding:9px 14px; font-size:.87rem; font-weight:600; cursor:pointer; white-space:nowrap; box-shadow:var(--shadow);
  transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
}
.btn:hover{filter:brightness(1.06); transform:translateY(-1px)}
.btn:active{transform:translateY(0); filter:brightness(.97)}
.btn.primary{background:var(--navy); color:var(--navy-ink)}
.btn.gold{background:var(--gold); color:var(--gold-ink)}
.btn.danger{color:#fff; background:var(--st-weak)}
.btn.ghost{background:transparent; box-shadow:none; color:var(--ink-dim)}
.btn.small{padding:5px 10px; font-size:.78rem; border-radius:8px}
.btn:disabled{opacity:.5; cursor:not-allowed}

/* ---- status dot (no border/stroke) ---- */
.status-dot{
  flex:none; width:30px; height:30px; border-radius:50%; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:.85rem; font-weight:700;
}
.status-dot.st-not_started{background:var(--st-none)}
.status-dot.st-weak{background:var(--st-weak)}
.status-dot.st-in_progress{background:var(--st-prog); color:var(--gold-ink)}
.status-dot.st-mastered{background:var(--st-done)}
.status-dot.pulse{animation:dot-pop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes dot-pop{
  0%{transform:scale(1)}
  45%{transform:scale(1.35); box-shadow:0 0 0 6px rgba(255,255,255,.15)}
  100%{transform:scale(1); box-shadow:0 0 0 0 rgba(255,255,255,0)}
}

/* ---- segmented progress bar (no border) ---- */
.seg-bar{height:9px; border-radius:999px; overflow:hidden; display:flex; background:var(--panel-3)}
.seg-bar > span{height:100%; display:block}
.seg-none{background:var(--st-none)}
.seg-weak{background:var(--st-weak)}
.seg-prog{background:var(--st-prog)}
.seg-done{background:var(--st-done)}
/* A slim per-topic version of the same segmented bar, but counting SCOUTS
   instead of topics -- how the whole troop is doing on this one topic, at a
   glance, without opening every scout's roster entry. Reuses the .seg-*
   color classes above so its palette always matches the rest of the app. */
.heat-strip{height:5px; border-radius:999px; overflow:hidden; display:flex; background:var(--panel-3); margin-top:6px}
.heat-strip > span{height:100%; display:block}
.progress-label{display:flex; justify-content:space-between; font-size:.72rem; color:var(--ink-dim); margin-top:3px}

/* ---- roster cards ---- */
.roster-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px}
.scout-card{
  background:var(--panel); border-radius:var(--radius); padding:14px 14px 14px 12px;
  box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px; cursor:pointer;
  border-left:4px solid transparent;
  transition:transform .15s ease, box-shadow .15s ease;
}
.scout-card:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,.12)}
.scout-card .row1{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
.row1-id{display:flex; align-items:center; gap:10px; min-width:0}
/* ---- avatar completion ring (conic-gradient around initials, no photo needed) ---- */
@property --pct{
  syntax: '<number>';
  inherits: true;
  initial-value: 0;
}
/* Registering --ring-color the same Houdini way as --pct above is what makes
   a rank promotion's color change animate on its own: conic-gradient() reads
   a registered <color> custom property as a first-class animatable value, so
   transitioning --ring-color smoothly repaints the gradient through every
   in-between hue instead of the flat color snap a plain custom property
   would give. See avatarRingHtml()/animateAvatarRings() for how the "from"
   color gets baked in on a promotion so there's something to transition
   from. */
@property --ring-color{
  syntax: '<color>';
  inherits: true;
  initial-value: #2C5A86;
}
.avatar-ring{
  --pct:0; --ring-color:var(--navy);
  position:relative; width:40px; height:40px; border-radius:50%; flex:none;
  display:flex; align-items:center; justify-content:center;
  background:conic-gradient(var(--ring-color) calc(var(--pct)*1%), var(--panel-3) 0);
  transition:--pct .7s cubic-bezier(.16,.84,.44,1), --ring-color 1.1s ease;
}
.avatar-ring::before{
  content:""; position:absolute; inset:3px; border-radius:50%; background:var(--panel);
}
.avatar-ring .avatar-initials{ position:relative; z-index:1; font-weight:800; font-size:.72rem; color:var(--ink); letter-spacing:.02em; }
.avatar-ring.avatar-ring-lg{ width:52px; height:52px; }
.avatar-ring.avatar-ring-lg .avatar-initials{ font-size:.85rem; }
/* The rank-up "trail": a comet-like arc sweeps once around the ring in the
   new rank's color while --ring-color (above) is busy morphing from the old
   rank's color to the new one underneath it, so the promotion reads as a
   single continuous motion rather than two unrelated effects. */
.avatar-ring.ranking-up::after{
  content:""; position:absolute; inset:-4px; border-radius:50%; pointer-events:none;
  background:conic-gradient(from 0deg, transparent 0deg, var(--ring-color) 35deg, transparent 95deg);
  animation:rank-trail-sweep 1.15s ease-out;
  z-index:2;
}
@keyframes rank-trail-sweep{
  0%{ transform:rotate(0deg); opacity:0; }
  12%{ opacity:1; }
  100%{ transform:rotate(360deg); opacity:0; }
}
.scout-name{font-weight:700; font-size:.98rem}
.scout-role{color:var(--ink-dim); font-size:.78rem; margin-top:2px}
.scout-patrol{display:flex; align-items:center; gap:5px; color:var(--ink-dim); font-size:.74rem; margin-top:3px}
.rank-pill{font-size:.72rem; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; color:#fff}
.att-mini{display:flex; gap:6px; flex-wrap:wrap; margin-top:-2px}
.att-mini-chip{font-size:.68rem; font-weight:700; padding:2px 8px; border-radius:999px}
.att-mini-chip.present{background:var(--st-done); color:#fff}
.att-mini-chip.absent{background:var(--st-weak); color:#fff}
.att-mini-chip.exempt{background:var(--st-prog); color:var(--gold-ink)}
.att-mini-chip.streak{background:var(--panel-3); color:var(--ink)}

.empty-state{
  text-align:center; padding:48px 16px; color:var(--ink-dim);
  border-radius:var(--radius); background:var(--panel-2); font-size:.92rem;
}
.empty-state::before{content:"🗒️"; display:block; font-size:2.2rem; margin-bottom:10px; opacity:.7}

/* ---- overlay / detail ---- */
.overlay{
  position:fixed; inset:0; background:rgba(10,15,20,.5); display:flex; align-items:flex-start;
  justify-content:center; padding:24px 12px; overflow-y:auto; z-index:50;
}
.detail-panel{ background:var(--panel); border-radius:16px; max-width:760px; width:100%; box-shadow:var(--shadow); margin:auto 0; }
.detail-panel.entering{ animation:modal-pop-in .16s ease; }
.detail-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:18px 20px; background:var(--panel-2); border-radius:16px 16px 0 0; }
.detail-head input.name-input{
  font-size:1.05rem; font-weight:700; border:none; background:transparent; color:var(--ink); padding:2px 0; width:100%;
}
.name-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.honorific-pill{font-size:.72rem; font-weight:700; color:var(--navy); background:var(--panel-3); padding:2px 8px; border-radius:999px}
.detail-meta{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; align-items:flex-end}
.detail-meta select, .detail-meta input[type="text"]{
  border:none; background:var(--panel); color:var(--ink); border-radius:8px; padding:6px 10px; font-size:.82rem;
}
.meta-field{display:flex; flex-direction:column; gap:2px}
.meta-field label{
  display:flex; align-items:center; gap:4px; font-size:.66rem; color:var(--ink-dim);
  text-transform:uppercase; letter-spacing:.03em; padding-left:2px;
}
.close-x{border:none; background:transparent; color:var(--ink-dim); font-size:1.3rem; cursor:pointer; line-height:1; padding:2px 6px}
.detail-body{padding:16px 20px 24px}
.overall-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:18px}
.overall-cell{background:var(--panel-2); border-radius:10px; padding:10px}
.overall-cell .r-name{font-size:.78rem; font-weight:700; margin-bottom:6px}
.overall-cell .r-pct{font-size:.72rem; color:var(--ink-dim); margin-top:4px}

.rank-section{border-radius:12px; margin-bottom:12px; overflow:hidden; background:var(--panel)}
.rank-section-head{
  display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 14px;
  background:var(--panel-2); cursor:pointer;
}
.rank-section-head h3{font-size:.95rem}
.rank-section-head .caret{transition:transform .15s; color:var(--ink-dim); display:inline-block}
.rank-section.open .caret{transform:rotate(90deg)}
.rank-section-body{display:none; padding:10px 14px 14px}
.rank-section.open .rank-section-body{display:block}
.rank-req{font-size:.78rem; color:var(--ink-dim); margin:2px 0 10px; line-height:1.5}
.rank-req b{color:var(--ink)}
.req-check-row{display:flex; align-items:flex-start; gap:8px; padding:3px 0; cursor:pointer}
.req-check-row input[type="checkbox"]{margin-top:3px; width:15px; height:15px; accent-color:var(--st-done); cursor:pointer; flex:none}
.req-check-text.done{color:var(--ink-dim); text-decoration:line-through; text-decoration-color:var(--st-done)}
.book-link{
  display:inline-flex; align-items:center; gap:6px; font-size:.78rem; font-weight:700; color:var(--navy);
  background:var(--gold); padding:6px 12px; border-radius:999px; text-decoration:none; margin-bottom:10px;
  border:none; cursor:pointer; font-family:inherit;
}
:root[data-theme="dark"] .book-link, :root:not([data-theme="light"]) .book-link{color:var(--gold-ink)}

/* ---- celebration (100% rank completion) ---- */
.confetti-layer{position:fixed; inset:0; pointer-events:none; z-index:200; overflow:hidden}
.confetti-piece{
  position:absolute; top:-20px; width:8px; height:14px; opacity:.9; border-radius:1px;
  animation-name:confetti-fall; animation-timing-function:linear; animation-fill-mode:forwards;
}
@keyframes confetti-fall{ to{ transform:translateY(112vh) rotate(var(--rot)); opacity:.3; } }
.celebration-toast{
  position:fixed; top:16px; left:50%; transform:translateX(-50%) translateY(-24px); z-index:201;
  background:var(--navy); color:var(--navy-ink); padding:12px 22px; border-radius:999px; font-weight:700;
  font-size:.9rem; box-shadow:0 10px 28px rgba(0,0,0,.28); opacity:0; transition:opacity .3s ease, transform .3s ease;
  max-width:90vw; text-align:center;
}
.celebration-toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.notice-toast{
  position:fixed; top:16px; left:50%; transform:translateX(-50%) translateY(-24px); z-index:201;
  background:var(--panel); color:var(--ink); padding:11px 20px; border-radius:12px; font-weight:600;
  font-size:.85rem; box-shadow:0 10px 28px rgba(0,0,0,.28); opacity:0; transition:opacity .3s ease, transform .3s ease;
  max-width:90vw; text-align:center; border:1px solid var(--line);
}
.notice-toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.notice-toast.error{background:var(--danger, #a33); color:#fff; border-color:transparent}

.topic-row{ display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--line); }
.topic-row:first-child{border-top:none}
.topic-main{flex:1; min-width:0}
.topic-title-row{display:flex; justify-content:space-between; gap:8px; align-items:baseline; cursor:pointer}
.topic-title{font-size:.87rem; font-weight:600}
.topic-page{font-size:.72rem; color:var(--ink-dim); white-space:nowrap}
.topic-status-label{font-size:.72rem; margin-top:2px; color:var(--ink-dim)}
.topic-detail{font-size:.8rem; color:var(--ink-dim); margin-top:6px; line-height:1.5; display:none}
.topic-detail.open{display:block}
.topic-detail div+div{margin-top:4px}
.topic-photo-row{display:flex; align-items:center; gap:8px; margin-top:6px}
.topic-photo-thumb{width:44px; height:44px; object-fit:cover; border-radius:8px; cursor:pointer; box-shadow:var(--shadow); flex:none}
.topic-edited-by{font-size:.7rem; opacity:.75; font-style:italic}

/* ---- curriculum tab (card grid) ---- */
.curr-cards-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; margin-top:2px}
.curr-card{
  display:flex; flex-direction:column; gap:6px; background:var(--panel-2); border-radius:12px;
  padding:12px; border:1px solid transparent; transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.curr-card:hover{transform:translateY(-2px); box-shadow:var(--shadow); border-color:var(--line)}
.curr-card .ci-main{flex:1; min-width:0; cursor:pointer}
.curr-card .ci-title{font-size:.87rem; font-weight:700}
.curr-card .ci-sub{
  font-size:.74rem; color:var(--ink-dim); margin-top:2px; display:-webkit-box;
  -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.curr-item-actions{display:flex; gap:4px; flex:none; margin-top:auto; padding-top:6px}
.curr-editor{background:var(--panel-2); border-radius:10px; padding:12px; margin:6px 0 10px; grid-column:1/-1}
.curr-editor-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.curr-editor-grid .full{grid-column:1/-1}
.curr-editor label{font-size:.7rem; color:var(--ink-dim); display:block; margin-bottom:2px}
.curr-editor input, .curr-editor textarea{
  width:100%; border:none; background:var(--panel); color:var(--ink); border-radius:7px;
  padding:6px 8px; font-size:.79rem; font-family:inherit; resize:vertical;
}
.curr-editor-foot{display:flex; justify-content:space-between; align-items:center; margin-top:8px}
/* Teaching notes are a leader's own shared scratchpad for delivering the
   topic (materials, timing, common pitfalls) -- kept visually distinct from
   the official bilingual curriculum text above it with a warm tint, so it
   never gets mistaken for something that needs translating or matching the
   book's wording. */
.teaching-notes-block{
  background:color-mix(in srgb, var(--gold) 12%, var(--panel)); border-radius:8px;
  padding:8px 10px; margin-top:10px; border:1px dashed color-mix(in srgb, var(--gold) 45%, transparent);
}
.teaching-notes-block label{display:flex; align-items:center; gap:5px; font-weight:700; color:var(--ink) !important}
.teaching-notes-block textarea{background:var(--panel) !important}
.ci-title-row{display:flex; align-items:center; gap:5px}
.teaching-notes-badge{font-size:.78rem; opacity:.85; flex:none}
.attach-row{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:8px 0}
.attach-chip{display:inline-flex; align-items:center; gap:4px; background:var(--panel-3); border-radius:999px; padding:4px 6px 4px 10px; font-size:.76rem}
.attach-chip a{color:var(--navy); text-decoration:none; font-weight:600; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
:root[data-theme="dark"] .attach-chip a, :root:not([data-theme="light"]) .attach-chip a{color:var(--gold)}
.attach-x{border:none; background:transparent; color:var(--ink-dim); cursor:pointer; font-size:.68rem; padding:2px 4px; line-height:1}
.ci-attachments{margin-top:4px}
.req-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:8px; margin:10px 0 14px}
.req-field label{font-size:.72rem; color:var(--ink-dim); display:block; margin-bottom:3px}
.req-field input{width:100%; border:none; background:var(--panel-2); color:var(--ink); border-radius:8px; padding:6px 9px; font-size:.8rem}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:.78rem; color:var(--ink-dim); margin-bottom:16px; align-items:center}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:12px; height:12px; border-radius:50%; display:inline-block}
.color-dot{width:10px; height:10px; border-radius:50%; display:inline-block; flex:none}

/* ---- schedule tab ---- */
.sched-pills{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; align-items:center}
.template-bar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px}
.template-bar select{border:none; background:var(--panel); color:var(--ink); border-radius:8px; padding:7px 10px; font-size:.82rem; box-shadow:var(--shadow)}
.template-chip{display:inline-flex; align-items:center; gap:5px; background:var(--panel-2); color:var(--ink-dim); font-size:.76rem; padding:4px 6px 4px 10px; border-radius:999px}
.tc-x{border:none; background:transparent; color:var(--ink-dim); cursor:pointer; font-size:.7rem; padding:2px}
.session-notes{
  width:100%; border:none; background:var(--panel); color:var(--ink); border-radius:0; padding:9px 12px;
  font-size:.85rem; font-family:inherit; resize:vertical; display:block;
}
/* ---- rich-text toolbar + live preview, shared by session notes and leader notes ----
   Stacking order top-to-bottom: toolbar (rounded top) / textarea (flat) / live
   preview (rounded bottom) -- one visually continuous control. */
.richtext-wrap{margin-bottom:14px; box-shadow:var(--shadow); border-radius:10px; overflow:hidden}
.richtext-toolbar{display:flex; gap:4px; background:var(--panel-3); padding:5px 6px}
.richtext-toolbar .rt-btn{
  border:none; background:var(--panel); color:var(--ink-dim); width:26px; height:24px; border-radius:6px;
  cursor:pointer; font-size:.78rem; display:flex; align-items:center; justify-content:center;
}
.richtext-toolbar .rt-btn:hover{background:var(--gold); color:var(--gold-ink)}
.richtext-preview{
  background:var(--panel-2); padding:9px 12px; font-size:.83rem; color:var(--ink);
  line-height:1.5; min-height:1.4em;
}
.richtext-preview ul{margin:4px 0; padding-left:20px}
.richtext-preview div{margin:1px 0}
.richtext-preview-empty{color:var(--ink-dim); font-style:italic}
.sched-pill{
  border:none; padding:7px 14px; border-radius:999px; font-size:.82rem; font-weight:600; cursor:pointer;
  background:var(--panel); color:var(--ink-dim); box-shadow:var(--shadow);
}
.sched-pill.active{background:var(--navy); color:var(--navy-ink)}
.sched-layout{display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap}
.sched-side{flex:1 1 220px; min-width:220px; max-width:280px; position:sticky; top:12px; max-height:calc(100vh - 24px); overflow-y:auto}
.sched-side-block{background:var(--panel); border-radius:12px; padding:10px; margin-bottom:10px; box-shadow:var(--shadow)}
.sched-side-block h4{
  font-size:.78rem; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-dim); margin-bottom:0;
  cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:6px; user-select:none; padding:2px 0;
}
.sched-side-block h4 .caret{transition:transform .15s; display:inline-block; flex:none; color:var(--ink-dim)}
.sched-side-block.open h4{margin-bottom:6px}
.sched-side-block.open h4 .caret{transform:rotate(90deg)}
.sched-side-block-body{display:none}
.sched-side-block.open .sched-side-block-body{display:block}
.sched-search-input{
  width:100%; border:none; background:var(--panel-2); color:var(--ink); border-radius:8px; padding:8px 10px;
  font-size:.85rem; font-family:inherit; margin-bottom:10px;
}
.source-chip{
  display:flex; align-items:center; gap:6px; font-size:.78rem; padding:6px 8px; border-radius:8px; margin-bottom:4px;
  background:var(--panel-2); cursor:pointer;
}
.source-chip:hover{background:var(--panel-3)}
.source-chip:active{cursor:grabbing}
.source-chip.chip-dragging{opacity:.4}
.timeline-wrap{flex:2 1 420px; min-width:280px; background:var(--panel); border-radius:12px; box-shadow:var(--shadow); overflow:hidden}
.timeline-scroll{max-height:640px; overflow-y:auto; position:relative}
.timeline{position:relative; touch-action:pan-y}
.sched-view-toggle{display:inline-flex; background:var(--panel-2); border-radius:999px; padding:3px; gap:2px}
.sched-view-btn{
  border:none; background:transparent; color:var(--ink-dim); padding:6px 12px; border-radius:999px;
  font-size:.78rem; font-weight:600; cursor:pointer; white-space:nowrap;
}
.sched-view-btn.active{background:var(--navy); color:var(--navy-ink)}
.sched-list{
  flex:2 1 420px; min-width:280px; background:var(--panel); border-radius:12px; box-shadow:var(--shadow);
  padding:8px; max-height:640px; overflow-y:auto;
}
.sched-list-row{
  display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:10px;
}
.sched-list-row:hover{background:var(--panel-2)}
.sched-list-row + .sched-list-row{border-top:1px solid var(--panel-2)}
.sched-list-swatch{width:10px; height:10px; border-radius:50%; flex:none}
.sched-list-main{flex:1; min-width:0; cursor:pointer}
.sched-list-title{font-size:.88rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sched-list-time{font-size:.76rem; color:var(--ink-dim); margin-top:1px}
.sched-list-controls{display:flex; gap:4px; flex:none}
.sched-list-arrow{
  border:none; background:var(--panel-2); color:var(--ink-dim); width:26px; height:26px; border-radius:7px;
  cursor:pointer; font-size:.72rem; display:flex; align-items:center; justify-content:center;
}
.sched-list-arrow:hover{background:var(--gold); color:var(--gold-ink)}
.sched-list-arrow:disabled{opacity:.3; cursor:default}
.sched-list-arrow:disabled:hover{background:var(--panel-2); color:var(--ink-dim)}
.sched-list-arrow.danger:hover{background:var(--st-weak); color:#fff}
.tl-drop-indicator{
  position:absolute; left:60px; right:8px; height:3px; border-radius:2px; background:var(--gold);
  opacity:0; pointer-events:none; transform:translateY(-1px); box-shadow:0 0 0 3px rgba(230,190,80,.25);
}
.tl-drop-indicator.visible{opacity:1}
.tl-create-ghost{
  position:absolute; left:60px; right:8px; border-radius:9px;
  background:color-mix(in srgb, var(--gold) 30%, transparent);
  border:2px dashed var(--gold); pointer-events:none; z-index:15;
  display:flex; align-items:flex-start; justify-content:center;
  padding-top:4px; font-size:.72rem; font-weight:700; color:var(--gold-ink);
}
.tl-now-line{
  position:absolute; left:0; right:0; height:2px; background:var(--st-weak); z-index:16; pointer-events:none;
}
.tl-now-line::before{
  content:""; position:absolute; left:2px; top:-4px; width:9px; height:9px; border-radius:50%; background:var(--st-weak);
}
.tl-hour-row{position:absolute; left:0; right:0; border-top:1px solid var(--line)}
.tl-hour-label{position:absolute; left:6px; top:-9px; font-size:.68rem; color:var(--ink-dim); background:var(--panel); padding:0 4px}
.tl-gutter{width:52px; flex:none}
.tl-block{
  position:absolute; left:60px; right:8px; border-radius:9px; padding:5px 8px; overflow:hidden;
  cursor:grab; user-select:none; box-shadow:0 2px 6px rgba(0,0,0,.18);
  border:1px solid rgba(255,255,255,.55); touch-action:none;
}
.tl-block.dragging{cursor:grabbing; opacity:.85; z-index:20}
.tl-block .tb-title{font-size:.76rem; font-weight:700; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tl-block .tb-time{font-size:.66rem; opacity:.85}
.tl-resize{position:absolute; left:0; right:0; bottom:0; height:14px; cursor:ns-resize; touch-action:none}
.tl-resize::after{content:""; position:absolute; left:50%; bottom:2px; width:24px; height:3px; border-radius:2px; background:var(--grip, rgba(255,255,255,.6)); transform:translateX(-50%)}

/* ---- multi-select blocks ---- */
/* A small always-on toggle in the corner of every block, so selecting on a
   touch screen never depends on a shift/ctrl-click a finger can't make.
   Desktop users can still shift/ctrl/cmd-click the block body itself. */
.tl-block.selected{outline:3px solid var(--gold); outline-offset:1px; box-shadow:0 3px 12px rgba(0,0,0,.32)}
.tl-select-toggle{
  position:absolute; top:3px; right:3px; width:18px; height:18px; border-radius:5px; z-index:5;
  background:rgba(255,255,255,.32); border:1.5px solid var(--grip, rgba(255,255,255,.7));
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  font-size:.62rem; line-height:1; color:inherit; opacity:.75; padding:0;
}
.tl-select-toggle:hover{opacity:1}
.tl-block.selected .tl-select-toggle{background:var(--gold); color:var(--gold-ink); border-color:var(--gold); opacity:1}
.sched-list-row.selected{background:color-mix(in srgb, var(--gold) 16%, transparent)}
.sched-list-check{flex:none; width:17px; height:17px; cursor:pointer; accent-color:var(--gold)}
.bulk-select-bar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--panel-2);
  border-radius:10px; padding:8px 12px; margin:0 0 10px; font-size:.82rem;
}
.bulk-select-bar .bsb-count{font-weight:700}
.bulk-select-swatches{display:flex; gap:5px; align-items:center}
.bulk-select-swatch{
  width:20px; height:20px; border-radius:50%; cursor:pointer; flex:none;
  border:2px solid rgba(255,255,255,.65); box-shadow:0 1px 3px rgba(0,0,0,.25);
}

/* ---- keyboard shortcuts overlay ---- */
.kbd-shortcuts-btn{font-size:1rem}
.kbd-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:200;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.kbd-panel{
  background:var(--panel); border-radius:14px; box-shadow:var(--shadow);
  max-width:440px; width:100%; max-height:82vh; overflow-y:auto; padding:20px 22px;
}
.kbd-panel h3{margin:0 0 14px}
.kbd-row{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:8px 0; border-bottom:1px solid var(--panel-2); font-size:.85rem;
}
.kbd-row:last-of-type{border-bottom:none}
.kbd-keys{display:flex; gap:4px; flex:none}
.kbd-key{
  background:var(--panel-2); border:1px solid var(--line); border-radius:6px;
  padding:2px 8px; font-family:monospace; font-size:.78rem; font-weight:700; color:var(--ink);
}
.kbd-close-hint{text-align:center; margin-top:14px; font-size:.72rem; color:var(--ink-dim)}

/* ---- attendance ---- */
.att-summary{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px; font-size:.82rem}
.att-summary span{display:flex; align-items:center; gap:6px; background:var(--panel); padding:6px 12px; border-radius:999px; box-shadow:var(--shadow)}
.att-row{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--panel); border-radius:12px; padding:10px 14px; margin-bottom:8px; box-shadow:var(--shadow);
}
.att-row .att-name{flex:1; min-width:120px; font-size:.87rem; font-weight:600}
.att-row .att-role{font-size:.72rem; color:var(--ink-dim)}
.att-btns{display:flex; gap:6px; flex-wrap:wrap}
.att-btn{border:none; border-radius:8px; padding:7px 12px; font-size:.78rem; font-weight:700; cursor:pointer; background:var(--panel-2); color:var(--ink-dim); transition:transform .1s ease}
.att-btn:hover{transform:translateY(-1px)}
.att-btn.present.active{background:var(--st-done); color:#fff}
.att-btn.absent.active{background:var(--st-weak); color:#fff}
.att-btn.exempt.active{background:var(--st-prog); color:var(--gold-ink)}

.att-heatmap{background:var(--panel); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; margin-bottom:16px}
.heat-head{display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:10px}
.heat-month-label{font-size:.85rem; font-weight:700; min-width:150px; text-align:center}
.heat-grid{display:grid; grid-template-columns:repeat(7, 1fr); gap:4px}
.heat-weekdays{margin-bottom:4px}
.heat-wd{text-align:center; font-size:.62rem; color:var(--ink-dim); text-transform:uppercase; font-weight:700}
.heat-cell{aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; border-radius:6px; font-size:.72rem; font-weight:600; cursor:pointer; color:var(--ink); transition:transform .1s ease; min-height:34px}
.heat-day-num{line-height:1}
.heat-day-count{font-size:.6rem; font-weight:700; opacity:.75; line-height:1}
.heat-cell:hover{transform:scale(1.08)}
.heat-cell.empty{cursor:default; visibility:hidden}
.heat-cell.today{box-shadow:inset 0 0 0 2px var(--navy)}
.heat-cell.selected{box-shadow:inset 0 0 0 2px var(--ink)}

/* ---- dashboard ---- */
.dash-stats{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px}
.dash-stat{
  flex:1 1 140px; background:var(--panel); border-radius:12px; padding:16px; box-shadow:var(--shadow); text-align:center;
  transition:transform .15s ease;
}
.dash-stat:hover{transform:translateY(-2px)}
.dash-stat-icon{font-size:1.3rem; margin-bottom:2px; opacity:.85}
.dash-stat-num{font-size:1.9rem; font-weight:800; color:var(--navy)}
:root[data-theme="dark"] .dash-stat-num, :root:not([data-theme="light"]) .dash-stat-num{color:var(--gold)}
.dash-stat-label{font-size:.76rem; color:var(--ink-dim); margin-top:2px; text-transform:uppercase; letter-spacing:.03em}
/* Only tinted once there's actually something to flag -- an empty state
   (0 scouts on a concerning streak) stays a plain neutral tile like the
   others, so the warning color itself is the signal. */
.dash-stat-warn .dash-stat-num{color:var(--st-weak)}
.dash-stat-warn{box-shadow:var(--shadow), inset 0 0 0 1px color-mix(in srgb, var(--st-weak) 35%, transparent)}
.dash-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.dash-panel{background:var(--panel); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow); min-width:0}
.dash-panel-wide{grid-column:1 / -1}
.dash-panel h3{font-size:.85rem; margin-bottom:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.03em; font-weight:700}
.data-mgmt-actions{display:flex; flex-wrap:wrap; gap:8px}
.dash-row{
  display:flex; align-items:center; gap:8px; padding:8px 4px; border-bottom:1px solid var(--line); cursor:pointer;
}
.dash-row:last-child{border-bottom:none}
.dash-row:hover{background:var(--panel-2)}
.dash-row-name{flex:1; min-width:0; font-size:.86rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dash-row-pct{font-size:.82rem; font-weight:700; color:var(--navy)}
:root[data-theme="dark"] .dash-row-pct, :root:not([data-theme="light"]) .dash-row-pct{color:var(--gold)}
.dash-row-sub{font-size:.74rem; color:var(--ink-dim); white-space:nowrap}
.dash-flag-pill{font-size:.7rem; font-weight:700; color:#fff; background:var(--st-weak); padding:3px 9px; border-radius:999px; white-space:nowrap; flex:none}
.dash-empty{color:var(--ink-dim); font-size:.82rem; padding:10px 4px}
.dash-activity-list{max-height:340px; overflow-y:auto}
.dash-activity-row{padding:7px 4px; border-bottom:1px solid var(--line)}
.dash-activity-row:last-child{border-bottom:none}
.dash-activity-text{font-size:.84rem}
.dash-activity-meta{font-size:.7rem; color:var(--ink-dim); margin-top:1px}
@media (max-width:720px){ .dash-grid{grid-template-columns:1fr} }

/* ---- patrols / teams ---- */
/* ---- patrol/team leaderboard ---- */
.leaderboard{background:var(--panel); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; margin-bottom:16px}
.leaderboard h3{font-size:.85rem; margin-bottom:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.03em; font-weight:700}
.leaderboard-row{display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--line)}
.leaderboard-row:first-child{border-top:none}
.lb-rank{flex:none; width:26px; text-align:center; font-size:.95rem; font-weight:800; color:var(--ink-dim)}
.lb-name{flex:none; width:130px; font-size:.86rem; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
/* A diverging bar centered on zero: positive totals grow rightward from the
   center in the team's own color, negative totals grow leftward from the
   center in a flat "in the red" tone. Scaling each side off Math.abs() alone
   used to make a -10 draw a LONGER bar than a +5 -- worse than every
   positive team, but visually reading as more impressive than all of them.
   Growing the opposite direction (and in a different, non-competing color)
   fixes that without needing to hide negative totals altogether. */
.lb-bar-track{flex:1; min-width:40px; height:9px; border-radius:999px; background:var(--panel-3); overflow:hidden; position:relative}
.lb-bar-zero{position:absolute; left:50%; top:0; bottom:0; width:1px; background:var(--ink-dim); opacity:.3}
.lb-bar-fill{position:absolute; top:0; height:100%; border-radius:999px; transition:width .5s cubic-bezier(.16,.84,.44,1), left .5s cubic-bezier(.16,.84,.44,1)}
.lb-bar-fill.neg{background:var(--st-weak) !important}
.lb-total{flex:none; width:48px; text-align:right; font-weight:800; color:var(--st-done)}
.lb-total.neg{color:var(--st-weak)}
.patrol-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px}
.patrol-card{background:var(--panel); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; border-top:4px solid transparent}
.patrol-card-head{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px}
.patrol-card-name{display:flex; align-items:center; gap:8px; font-weight:700; font-size:1rem}
.patrol-card-total{font-size:1.3rem; font-weight:800; color:var(--st-done)}
.patrol-card-total.neg{color:var(--st-weak)}
.patrol-card-actions{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px}
.patrol-section{margin-top:10px; padding-top:10px; border-top:1px solid var(--line)}
.patrol-section h4{font-size:.76rem; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-dim); margin-bottom:6px}
.patrol-member-row{display:flex; align-items:center; gap:6px; padding:4px 0}
.pm-name{flex:1; min-width:0; font-size:.85rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pm-duty{border:none; background:var(--panel-2); color:var(--ink); border-radius:8px; padding:4px 8px; font-size:.76rem}
.patrol-add-member{width:100%; margin-top:6px; border:none; background:var(--panel-2); color:var(--ink); border-radius:8px; padding:6px 9px; font-size:.8rem}
.patrol-log{max-height:200px; overflow-y:auto}
.patrol-log-row{display:flex; align-items:center; gap:8px; padding:5px 0; border-top:1px solid var(--line); font-size:.78rem}
.patrol-log-row:first-child{border-top:none}
.plog-delta{font-weight:800; flex:none; min-width:28px}
.plog-delta.pos{color:var(--st-done)}
.plog-delta.neg{color:var(--st-weak)}
.plog-reason{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.plog-meta{color:var(--ink-dim); font-size:.68rem; white-space:nowrap; flex:none}

/* ---- passphrase gate ---- */
.gate-overlay{
  position:fixed; inset:0; z-index:500; background:var(--navy);
  display:flex; align-items:center; justify-content:center; padding:16px;
}
.gate-card{
  background:var(--panel); border-radius:16px; padding:28px 24px; max-width:320px; width:100%;
  box-shadow:0 12px 40px rgba(0,0,0,.35); text-align:center;
}
.gate-title{font-size:1.2rem; font-weight:800; margin-bottom:6px}
.gate-subtitle{font-size:.82rem; color:var(--ink-dim); margin-bottom:16px}
.gate-input{
  width:100%; border:none; background:var(--panel-2); color:var(--ink); border-radius:9px;
  padding:11px 13px; font-size:.95rem; font-family:inherit; text-align:center; margin-bottom:10px;
}
.gate-error{color:var(--st-weak); font-size:.78rem; margin-bottom:10px}
.gate-btn{width:100%}

/* ---- modal ---- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(10,15,20,.5); display:flex; align-items:center; justify-content:center;
  padding:16px; z-index:60; animation:modal-fade-in .15s ease;
}
.modal{
  background:var(--panel); border-radius:14px; max-width:440px; width:100%; padding:20px; box-shadow:var(--shadow);
  max-height:90vh; overflow-y:auto; animation:modal-pop-in .16s ease;
}
@keyframes modal-fade-in{ from{opacity:0} to{opacity:1} }
@keyframes modal-pop-in{ from{opacity:0; transform:scale(.96) translateY(4px)} to{opacity:1; transform:scale(1) translateY(0)} }
.modal h3{margin-bottom:12px; font-size:1rem}
.modal .field{margin-bottom:12px}
.modal .field label{display:block; font-size:.78rem; color:var(--ink-dim); margin-bottom:4px}
.modal .field input, .modal .field select, .modal .field textarea{
  width:100%; border:none; background:var(--panel-2); color:var(--ink); border-radius:8px; padding:8px 10px; font-size:.87rem; font-family:inherit;
}
.modal .field-row{display:flex; gap:8px}
.modal .field-row .field{flex:1}
.swatches{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.swatch{width:26px; height:26px; border-radius:50%; cursor:pointer; border:none}
.swatch.selected{outline:2px solid var(--navy); outline-offset:2px}
.color-picker{display:flex; flex-direction:column; gap:8px}
.color-custom-swatch{
  width:26px; height:26px; border-radius:50%; flex:none; cursor:pointer; display:flex;
  align-items:center; justify-content:center; position:relative;
}
.color-custom-swatch.selected .color-custom-input{outline:2px solid var(--navy); outline-offset:2px}
.color-custom-input{
  width:26px; height:26px; padding:0; border:none; border-radius:50%; cursor:pointer;
  background:conic-gradient(red,#e5e500,lime,cyan,blue,magenta,red);
}
.color-custom-input::-webkit-color-swatch-wrapper{padding:0; border-radius:50%}
.color-custom-input::-webkit-color-swatch{border:2px solid var(--panel); border-radius:50%}
.color-custom-input::-moz-color-swatch{border:2px solid var(--panel); border-radius:50%}
.hex-input{
  width:110px; border:none; background:var(--panel-2); color:var(--ink); border-radius:8px;
  padding:6px 10px; font-size:.82rem; font-family:inherit; text-transform:uppercase;
}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px}
.file-viewer-modal{max-width:900px}
.file-viewer-modal iframe, .file-viewer-modal video{display:block}

.footer-note{text-align:center; color:var(--ink-dim); font-size:.75rem; margin-top:28px}

/* ---- select-to-look-up floating button (Nayiri.com for Armenian selections,
   Wiktionary for English ones) ---- */
.lookup-btn{
  display:none; position:fixed; z-index:210; transform:translate(-50%,-100%);
  background:var(--navy); color:#fff; border:none; border-radius:999px;
  padding:8px 14px; font-size:.78rem; font-weight:700; font-family:inherit;
  cursor:pointer; box-shadow:var(--shadow); white-space:nowrap; max-width:280px;
  overflow:hidden; text-overflow:ellipsis;
}
.lookup-btn.show{display:block}
.lookup-btn:hover{background:var(--gold); color:var(--gold-ink)}
@media (max-width:720px){ .sched-layout{flex-direction:column} .sched-side{max-width:none; position:static; max-height:none; overflow-y:visible} }

/* ---- printable scout report ----
   Only used as a last-resort fallback (printScoutReport() normally opens the
   report as its own document in a new tab instead); mirrors that document's
   class names at a reduced level of detail so it still looks reasonable if
   ever hit. */
#printReportHolder{display:none}
@media print{
  body > *:not(#printReportHolder){display:none !important}
  #printReportHolder{
    display:block !important; position:static; background:#fff; color:#16303f; padding:0; margin:0;
  }
  .print-report{max-width:none}
  .pr-band{display:flex; align-items:center; gap:14px; background:#0C3953; color:#fff; margin:0 0 20px; padding:14px 18px}
  .pr-band-logo{flex:none; width:28px; color:#fff}
  .pr-band-logo svg{display:block; width:100%; height:auto}
  .pr-band-org{flex:1; min-width:0}
  .pr-band-title{font-weight:700; font-size:1rem}
  .pr-band-sub{font-size:.74rem; opacity:.8}
  .pr-band-date{font-size:.72rem; text-align:right; opacity:.9}
  .pr-header{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:18px}
  .pr-header h1{font-size:1.4rem; margin:0 0 6px}
  .pr-current-rank{display:inline-block; color:#fff; font-size:.72rem; font-weight:700; padding:3px 10px; border-radius:999px}
  .ov-chips{display:flex; gap:8px; flex-wrap:wrap}
  .ov-chip{border:1.5px solid #ccc; border-radius:8px; padding:5px 10px; text-align:center}
  .ov-chip-name{font-size:.62rem; color:#666}
  .ov-chip-pct{font-size:.92rem; font-weight:800}
  .rank-block{margin-bottom:16px; page-break-inside:avoid}
  .rank-block-head{display:flex; align-items:center; justify-content:space-between; gap:10px; border-bottom:2.5px solid #ccc; padding-bottom:5px; margin-bottom:6px}
  .rank-block-head h3{font-size:1rem; margin:0}
  .rank-block-pct{color:#fff; font-size:.76rem; font-weight:800; padding:2px 10px; border-radius:999px}
  .print-table{width:100%; border-collapse:collapse; font-size:.84rem}
  .print-table td{padding:5px 4px; border-bottom:1px solid #eee}
  .print-table .page-col{color:#888; font-size:.74rem; width:44px}
  .print-table td:last-child{text-align:right; white-space:nowrap}
  .st-badge{display:inline-block; font-size:.7rem; font-weight:700; padding:2px 9px; border-radius:999px}
  .pr-footer{margin-top:20px; text-align:center; color:#999; font-size:.68rem; border-top:1px solid #eee; padding-top:10px}
}

/* ---- more movement: interaction feedback only (hover/press), never an
   entrance animation on list items -- render() fully replaces #app's
   innerHTML on almost every interaction (a click, a keystroke, a db
   snapshot), so any "animation:" tied to card/row selectors would replay
   on every single re-render and cause a site-wide flicker. Everything
   here is state-based (:hover/:active) or fires only when a value the
   browser is already watching (like width) actually changes. ---- */
.btn{ transition: transform .12s ease, box-shadow .12s ease, background-color .15s ease }
.btn:active{ transform: scale(.96) }
.att-btn{ transition: transform .12s ease, background-color .15s ease }
.att-btn:active{ transform: scale(.94) }
.rank-pill, .st-badge{ transition: transform .15s ease }
.heat-cell{ transition: transform .12s ease, background-color .2s ease }

/* Respect the OS-level "reduce motion" accessibility setting: flatten every
   animation/transition to effectively instant instead of playing it. */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:0.001ms !important; animation-iteration-count:1 !important;
    transition-duration:0.001ms !important; scroll-behavior:auto !important;
  }
}
</style>

function roleLabel(code){
  const r = ROLES.find(x=>x.code===code);
  if(!r) return "";
  return LANG==="en" ? r.en : r.hy;
}
/* Bashdon (Պաշտօն) — a scout's actual current duty, meaningful only within a
   patrol: patrol leader or deputy. Reuses the "leader"/"deputy_leader" labels
   from ROLES (Առաջնորդ / Փոխ-Առաջնորդ) rather than "Խմբապետ" family, per the
   troop's own usage -- separate from Աստիճան (Asdijan), which is the scout's
   personal leadership qualification/rank and uses the full ROLES list. */
const DUTY_CODES = ["leader","deputy_leader"];

function loc(obj, base){

/* Initials for the avatar ring -- from the bare name, not the honorific-
   prefixed display name (so "Եղբայր Ալէգս Պաղպուտէրեան" gives "ԱՊ", not "ԵԱ"). */
function scoutInitials(s){
  const nm = (LANG==="en" ? (s.nameEn||s.nameHy) : (s.nameHy||s.nameEn)) || "";
  const parts = nm.trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return "?";
  const first = parts[0].charAt(0);
  const last = parts.length>1 ? parts[parts.length-1].charAt(0) : "";
  return (first+last).toUpperCase();
}
/* A small conic-gradient "completion ring" standing in for an avatar photo
   (this app has none): the ring fill is the scout's % progress on their
   current rank, colored to match that rank. */
function avatarRingHtml(initials, pct, color, extraClass, fromColor){
  const p = Math.max(0,Math.min(100,pct||0));
  const finalColor = color||"var(--navy)";
  /* --pct starts at 0 here on purpose: the ring animates up to its real value
     via animateAvatarRings(), which runs right after this markup lands in the
     DOM. Baking the final value straight into this inline style would give
     the browser nothing to transition from (a freshly-inserted node has no
     "before" state), so it would just snap instead of filling in. The same
     trick applies to --ring-color during a rank-up: fromColor (the OLD
     rank's color) is what gets baked in below, with the real color stashed
     in data-final-color for animateAvatarRings() to apply a beat later. */
  return `<div class="avatar-ring ${extraClass||""}" data-pct="${p}" data-final-color="${esc(finalColor)}" style="--pct:0; --ring-color:${esc(fromColor||finalColor)}" title="${p}%">
    <span class="avatar-initials">${esc(initials)}</span>
  </div>`;
}
function animateAvatarRings(){
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      document.querySelectorAll(".avatar-ring[data-pct]").forEach(el=>{
        el.style.setProperty("--pct", el.dataset.pct);
        if(el.dataset.finalColor) el.style.setProperty("--ring-color", el.dataset.finalColor);
      });
    });
  });
}
/* Dashboard KPI tiles count up from 0 to their real value instead of just
   appearing -- same "bake the end state as a data attribute, animate it in
   with JS after the node lands" approach as the avatar rings above, since a
   text node has no CSS transition to lean on the way --pct does. */
function animateDashboardCounts(){
  const nums = document.querySelectorAll(".dash-stat-num[data-count-target]");
  if(!nums.length) return;
  const reduced = prefersReducedMotion();
  nums.forEach(el=>{
    const target = parseInt(el.dataset.countTarget, 10) || 0;
    if(reduced || target === 0){ el.textContent = target; return; }
    const duration = 700;
    const start = performance.now();
    function tick(now){
      const progress = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = Math.round(target * eased);
      if(progress < 1) requestAnimationFrame(tick);
      else el.textContent = target;
    }
    requestAnimationFrame(tick);
  });
}

/* =========================== WORD LOOKUP =========================== */
/* Select-to-look-up: selecting any text on the page shows a small floating
   button; clicking it opens the term in Nayiri.com's HY->EN dictionary
   (Armenian selections) or English Wiktionary (English selections), in a
   new tab. Mirrors the Future-Builder Badge site's initLookup(), adapted to
   this app's LANG global and to a fixed (viewport-relative) button position
   so no scroll-offset math is needed -- the button just hides on scroll
   instead of tracking the selection while the page moves. */
function initWordLookup(){
  let btn = document.getElementById("lookupBtn");
  if(!btn){
    btn = document.createElement("button");
    btn.id = "lookupBtn";
    btn.type = "button";
    btn.className = "lookup-btn";
    document.body.appendChild(btn);
  }
  function hideBtn(){ btn.classList.remove("show"); }
  function showForSelection(){
    const sel = window.getSelection();
    const text = sel && sel.toString().trim();
    if(!text || text.length < 2 || text.length > 60 || sel.rangeCount===0){ hideBtn(); return; }
    const rect = sel.getRangeAt(0).getBoundingClientRect();
    if(rect.width===0 && rect.height===0){ hideBtn(); return; }
    const short = text.length > 20 ? text.slice(0,20)+"…" : text;
    btn.textContent = (LANG==="en" ? "🔎 Look up " : "🔎 Փնտռել՝ ") + '"'+short+'"';
    btn.style.left = (rect.left + rect.width/2) + "px";
    btn.style.top = (rect.top - 10) + "px";
    btn.dataset.term = text;
    btn.classList.add("show");
  }
  document.addEventListener("mouseup", (e)=>{
    if(e.target===btn) return;
    setTimeout(showForSelection, 5);
  });
  document.addEventListener("touchend", (e)=>{
    if(e.target===btn) return;
    setTimeout(showForSelection, 5);
  });
  document.addEventListener("selectionchange", ()=>{
    const sel = window.getSelection();
    if(!sel || !sel.toString().trim()) hideBtn();
  });
  document.addEventListener("scroll", hideBtn, true);
  btn.addEventListener("click", ()=>{
    const term = (btn.dataset.term||"").trim();
    if(!term) return;
    const url = LANG==="en"
      ? "https://en.wiktionary.org/wiki/" + encodeURIComponent(term.replace(/\s+/g,"_"))
      : "http://www.nayiri.com/search?dt=HY_EN&query=" + encodeURIComponent(term) + "&l=en";
    window.open(url, "_blank", "noopener");
    hideBtn();
    window.getSelection().removeAllRanges();
  });
}

/* =========================== LIGHTWEIGHT TEXT FORMATTING =========================== */
/* A few written-note areas (session notes, leader notes) get a tiny
   formatting toolbar -- bold/italic/bullet -- instead of staying plain
   text. Storage is plain markdown-lite (**bold**, *italic*, "- " bullet
   lines); renderRichText() turns that into escaped, safe HTML for a live
   preview under the textarea. This is deliberately not a full markdown
   parser -- just enough to make notes readable at a glance. */
function formatInline(s){
  let h = esc(s);
  h = h.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/\*(.+?)\*/g, "<em>$1</em>");
  return h;
}
function renderRichText(raw){
  if(!raw) return "";
  const lines = String(raw).split("\n");
  let html = "", inList = false;
  lines.forEach(line=>{
    const bulletMatch = /^\s*-\s+(.*)$/.exec(line);
    if(bulletMatch){
      if(!inList){ html += "<ul>"; inList = true; }
      html += "<li>" + formatInline(bulletMatch[1]) + "</li>";
    } else {
      if(inList){ html += "</ul>"; inList = false; }
      html += line.trim()==="" ? "<br>" : ("<div>" + formatInline(line) + "</div>");
    }
  });
  if(inList) html += "</ul>";
  return html;
}
function richTextToolbarHtml(targetId){
  return `<div class="richtext-toolbar" data-target="${targetId}">
    <button type="button" class="rt-btn" data-fmt="bold" title="${esc(t('fmtBold'))}"><b>B</b></button>
    <button type="button" class="rt-btn" data-fmt="italic" title="${esc(t('fmtItalic'))}"><i>I</i></button>
    <button type="button" class="rt-btn" data-fmt="bullet" title="${esc(t('fmtBullet'))}">≡</button>
  </div>`;
}
function applyTextFormatting(textarea, kind){
  const start = textarea.selectionStart, end = textarea.selectionEnd;
  const val = textarea.value;
  const selected = val.slice(start, end);
  let insert;
  if(kind==="bold") insert = "**" + (selected || "text") + "**";
  else if(kind==="italic") insert = "*" + (selected || "text") + "*";
  else if(kind==="bullet") insert = (selected || "item").split("\n").map(l=> l.startsWith("- ") ? l : "- "+l).join("\n");
  else return;
  textarea.value = val.slice(0, start) + insert + val.slice(end);
  textarea.focus();
  const cursor = start + insert.length;
  textarea.setSelectionRange(cursor, cursor);
  textarea.dispatchEvent(new Event("input", {bubbles:true}));
  textarea.dispatchEvent(new Event("change", {bubbles:true}));
}
function wireRichTextToolbars(root){
  root.querySelectorAll(".richtext-toolbar").forEach(bar=>{
    const ta = document.getElementById(bar.dataset.target);
    if(!ta) return;
    bar.querySelectorAll(".rt-btn").forEach(btn=>{
      btn.addEventListener("click", (e)=>{ e.preventDefault(); applyTextFormatting(ta, btn.dataset.fmt); });
    });
    const preview = document.getElementById(bar.dataset.target + "Preview");
    if(preview){
      const update = ()=>{ preview.innerHTML = renderRichText(ta.value) || `<span class="richtext-preview-empty">${esc(t("richTextEmpty"))}</span>`; };
      ta.addEventListener("input", update);
      update();
    }
  });
}

/* =========================== TOPIC NOTE PHOTOS =========================== */
/* A quick-add photo (e.g. a page of handwritten notes, a badge sign-off
   sheet) attached to one scout's progress record for one topic. Downscaled
   and re-encoded client-side before it ever reaches the db, both so a
   phone photo doesn't blow past the per-document size cap and so the
   roster stays fast to sync. */
function readAndResizeImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(reader.error);
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error("bad image"));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; } else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function handleTopicPhotoFile(scoutId, topicId, file){
  if(!file) return;
  try{
    const dataUrl = await readAndResizeImage(file, 480, 0.72);
    if(dataUrl.length > 220000){ showNotice(t("photoTooLarge"), true); return; }
    const key = progressKey(scoutId, topicId);
    const existing = progress[key] || {scoutId, topicId, status:"not_started"};
    await upsertDoc("progress", key, Object.assign({}, existing, {photo: dataUrl}));
    const s = scouts[scoutId], tp = topics[topicId];
    if(s && tp) logActivity(t("activityPhotoAdded").replace("{topic}", loc(tp,"title")).replace("{scout}", scoutDisplayName(s)));
  }catch(e){ showNotice(t("photoError"), true); }
}

/* =========================== DB HELPERS =========================== */
function progressKey(scoutId, topicId){ return scoutId + "__" + topicId; }
/* ---- rank requirement checklist (age/experience/condition/leadership),
   tracked per scout+rank+requirement -- separate from topic mastery and
   never folded into rankPercent(), since this is an administrative
   sign-off (has the paperwork been verified?) rather than curriculum
   progress. ---- */
const REQ_KEYS = ["age","experience","condition","leadership"];
function reqCheckKey(scoutId, rankId, reqKey){ return scoutId + "__" + rankId + "__" + reqKey; }
function isReqChecked(scoutId, rankId, reqKey){
  const rec = reqChecks[reqCheckKey(scoutId, rankId, reqKey)];

}
function sortedRanks(){ return Object.values(ranks).sort((a,b)=> (a.order||0)-(b.order||0)); }
function topicsForRank(rankId){ return Object.values(topics).filter(tp=>tp.rankId===rankId).sort((a,b)=>(a.order||0)-(b.order||0)); }
function sortedScouts(){ return Object.values(scouts).sort((a,b)=>(a.order||0)-(b.order||0)); }
function sortedCategories(){ return Object.values(categories).sort((a,b)=>(a.order||0)-(b.order||0)); }
function itemsForCategory(catId){ return Object.values(catItems).filter(i=>i.categoryId===catId).sort((a,b)=>(a.order||0)-(b.order||0)); }
function sortedSchedulesForDate(date){ return Object.values(schedules).filter(s=>s.date===date).sort((a,b)=>(a.order||0)-(b.order||0)); }
function sortedScheduleTemplates(){ return Object.values(scheduleTemplates).sort((a,b)=>(a.order||0)-(b.order||0)); }

/* =========================== PATROLS (Խմբակներ) =========================== */
function sortedPatrols(){ return Object.values(patrols).sort((a,b)=>(a.order||0)-(b.order||0)); }
function patrolMembers(patrolId){ return sortedScouts().filter(s=>s.patrolId===patrolId); }
function pointEntriesForPatrol(patrolId){
  return Object.values(patrolPoints).filter(p=>p.patrolId===patrolId).sort((a,b)=> new Date(b.at||0) - new Date(a.at||0));
}
function patrolTotal(patrolId){
  return Object.values(patrolPoints).filter(p=>p.patrolId===patrolId).reduce((sum,p)=> sum + (Number(p.delta)||0), 0);
}
/* Awards an automatic point entry once per unique event (autoKey), so the
   same attendance mark or topic mastery never double-awards. If the user
   deletes the resulting log entry, it stays deleted -- it only reappears if
   the same triggering event happens again (e.g. un-marking and re-marking
   present), which is treated as a fresh occurrence rather than a duplicate. */
function awardAutoPoints(patrolId, delta, reasonKey, reasonArgs, autoKey){
  if(!patrolId) return;
  const already = Object.values(patrolPoints).some(p=> p.autoKey===autoKey);
  if(already) return;
  const id = "pp_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  let reason = t(reasonKey);
  Object.keys(reasonArgs||{}).forEach(k=> reason = reason.replace("{"+k+"}", reasonArgs[k]));
  upsertDoc("patrolPoints", id, { id, patrolId, delta, reason, source:"auto", autoKey, createdBy: EDITOR_NAME||null, at: new Date().toISOString() });
}
function awardAttendanceAutoPoint(scoutId, date, status){
  if(status!=="present") return;
  const s = scouts[scoutId];
  if(!s || !s.patrolId) return;
  awardAutoPoints(s.patrolId, 1, "ptReasonAttendance", {scout: scoutDisplayName(s)}, "att__"+date+"__"+scoutId);
}
/* All dates that have any actual session activity (a schedule and/or attendance
   taken), so Prev/Next and the jump dropdown skip empty calendar days entirely. */
function allSessionDates(){
  const set = new Set();
  Object.values(schedules).forEach(s=>{ if(s.date) set.add(s.date); });
  Object.values(attendance).forEach(a=>{ if(a.date) set.add(a.date); });
  return Array.from(set).sort();
}
function stepSessionDate(current, dir){
  const dates = allSessionDates();
  if(dir < 0){ const earlier = dates.filter(d=>d<current); return earlier.length ? earlier[earlier.length-1] : null; }
  const later = dates.filter(d=>d>current); return later.length ? later[0] : null;
}
function formatDateTime(iso){
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  try{ return new Intl.DateTimeFormat(LANG==="en"?"en-US":"hy", {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"}).format(d); }
  catch(e){ return ""; }
}
function formatSessionDate(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  if(isNaN(d.getTime())) return dateStr;
  try{ return new Intl.DateTimeFormat(LANG==="en"?"en-US":"hy", {weekday:"short", year:"numeric", month:"short", day:"numeric"}).format(d); }
  catch(e){ return dateStr; }
}
function sessionNavHtml(currentDate, stepAction, selectId){
  const dates = allSessionDates();
  const hasPrev = !!stepSessionDate(currentDate, -1);
  const hasNext = !!stepSessionDate(currentDate, 1);
  const options = dates.map(d=>`<option value="${esc(d)}" ${d===currentDate?"selected":""}>${esc(formatSessionDate(d))}</option>`).join("");
  return `
  <div class="date-nav">

    <button type="button" class="btn small" data-action="${stepAction}" data-dir="1" title="${esc(t('nextSession'))}" ${hasNext?"":"disabled"}>›</button>
    ${dates.length ? `<select id="${selectId}" title="${esc(t('jumpToSession'))}"><option value="">${esc(t('jumpToSession'))}</option>${options}</select>` : ""}

}
function blocksForSchedule(schedId){ return Object.values(scheduleBlocks).filter(b=>b.scheduleId===schedId).sort((a,b)=>(a.startMin||0)-(b.startMin||0)); }
function blockDisplayTitle(b){
  if(b.sourceType==="rank"){ const tp = topics[b.sourceId]; if(tp) return loc(tp,"title"); }
  else if(b.sourceType==="category"){ const it = catItems[b.sourceId]; if(it) return loc(it,"title"); }
  return b.title || "";
}
function attendanceSummary(scoutId){
  let present=0, absent=0, exempt=0;
  Object.values(attendance).forEach(a=>{
    if(a.scoutId!==scoutId) return;
    if(a.status==="present") present++;
    else if(a.status==="absent") absent++;
    else if(a.status==="exempt") exempt++;
  });
  return {present, absent, exempt, total: present+absent+exempt};
}
/* % of sessions with an actual attendance record (present/absent/exempt) that
   were "present" -- sessions never marked at all for this scout aren't held
   against them, since a mark may simply not have been taken yet. */
function attendanceRate(scoutId){
  const {present, total} = attendanceSummary(scoutId);
  if(!total) return null;
  return Math.round(present/total*100);
}
/* Consecutive most-recent sessions (by date, latest first) the scout was
   present for. "Exempt" is excused and doesn't break a streak; "absent" or a
   session with no record at all for them does. */
/* average mastery weight (0-1) for a topic across all active scouts whose
   current rank has reached that topic -- used for the most/least-taught
   dashboard panels. Topics with no scouts on their rank yet are excluded
   rather than shown as 0%, since that's "not reached" not "not taught". */
/* How many of the scouts currently on this topic's rank have actually
   MASTERED it -- a plain completion count/rate, not a weighted blend of
   partial credit, so the dashboard panel reads as "8 of 11 scouts have
   completed this" rather than an ambiguous coverage score. */
function topicCompletionStat(topicId){
  const tp = topics[topicId];
  if(!tp) return null;
  /* Measured against the whole active roster, not just scouts currently at
     that topic's rank -- so every topic reads as "X of 26 scouts", a single
     consistent total across Norakir/Norendza/Pen Gark/Ayp Gark alike. */
  const relevant = sortedScouts();
  if(!relevant.length) return null;
  const mastered = relevant.filter(s=> statusFor(s.id, topicId)==="mastered").length;
  return { mastered, total: relevant.length, rate: mastered / relevant.length };
}
function topicsByCompletion(){
  return Object.values(topics)
    .map(tp=> ({tp, stat: topicCompletionStat(tp.id)}))
    .filter(x=> x.stat !== null)
    .sort((a,b)=> b.stat.rate - a.stat.rate);
}
function attendanceStreak(scoutId){
  const dates = allSessionDates().slice().sort((a,b)=> b.localeCompare(a));
  let streak = 0;
  for(const d of dates){
    const rec = attendance[d+"__"+scoutId];
    if(rec && rec.status==="present") streak++;
    else if(rec && rec.status==="exempt") continue;
    else break;
  }
  return streak;
}
/* Dates that actually have at least one attendance record taken, as opposed
   to allSessionDates() which also counts a schedule's own date before
   anyone has been marked for it -- pulling those in here would make a
   scout's very next, still-unmarked session immediately count as a missed
   one and flag everybody at once. */
function attendanceTakenDates(){
  const set = new Set();
  Object.values(attendance).forEach(a=>{ if(a.date) set.add(a.date); });
  return Array.from(set).sort();
}
/* How many consecutive sessions (latest attendance-taken date first) a scout
   has been marked absent for. Mirrors attendanceStreak()'s treatment of
   "exempt" -- an excused session is skipped over and doesn't break the
   streak -- but for the opposite status; a "present" mark, same as a
   session with no record at all for this scout, ends it. */
const CONSECUTIVE_ABSENCE_FLAG_THRESHOLD = 3;
function attendanceAbsentStreak(scoutId){
  const dates = attendanceTakenDates().slice().sort((a,b)=> b.localeCompare(a));
  let streak = 0;
  for(const d of dates){
    const rec = attendance[d+"__"+scoutId];
    if(rec && rec.status==="absent") streak++;
    else if(rec && rec.status==="exempt") continue;
    else break;
  }
  return streak;
}

function statusFor(scoutId, topicId){
  const p = progress[progressKey(scoutId, topicId)];
  return (p && p.status) || "not_started";
}
function rankStatusCounts(scoutId, rankId){
  const list = topicsForRank(rankId);
  const c = {not_started:0, weak:0, in_progress:0, mastered:0};
  list.forEach(tp=>{ c[statusFor(scoutId, tp.id)]++; });
  return {counts:c, total:list.length};
}
function rankPercent(scoutId, rankId){
  const {counts, total} = rankStatusCounts(scoutId, rankId);
  if(!total) return 0;
  let sum = 0;
  Object.keys(counts).forEach(k=> sum += counts[k]*STATUS_META[k].weight);
  return Math.round(sum/total);
}
function segBarHtml(scoutId, rankId){
  const {counts, total} = rankStatusCounts(scoutId, rankId);
  if(!total) return '<div class="seg-bar"></div>';
  const segs = [
    ["seg-none", counts.not_started], ["seg-weak", counts.weak],
    ["seg-prog", counts.in_progress], ["seg-done", counts.mastered],
  ];
  return '<div class="seg-bar">' + segs.map(([cls,n])=> n ? `<span class="${cls}" style="width:${(n/total*100)}%"></span>` : "").join("") + "</div>";
}
/* Same segmented-bar idea as rankStatusCounts()/segBarHtml() above, but
   flipped: counts every SCOUT's status on one fixed topic, instead of every
   topic's status for one fixed scout. That's what turns it into a per-topic
   "how's the whole troop doing on this" strip rather than a per-scout
   progress bar. */
function topicStatusCounts(topicId){
  const list = sortedScouts();
  const c = {not_started:0, weak:0, in_progress:0, mastered:0};
  list.forEach(s=> c[statusFor(s.id, topicId)]++);
  return {counts:c, total:list.length};
}
function topicHeatStripHtml(topicId){
  const {counts, total} = topicStatusCounts(topicId);
  if(!total) return "";
  const segs = [
    ["seg-none", counts.not_started], ["seg-weak", counts.weak],
    ["seg-prog", counts.in_progress], ["seg-done", counts.mastered],
  ];
  const pct = Math.round((counts.mastered/total)*100);
  return `<div class="heat-strip" title="${esc(t('heatStripTitle').replace('{pct}', pct))}">${segs.map(([cls,n])=> n ? `<span class="${cls}" style="width:${(n/total*100)}%"></span>` : "").join("")}</div>`;
}

async function setStatus(scoutId, topicId, status){
  const key = progressKey(scoutId, topicId);
  const updatedAt = new Date().toISOString();
  /* set() is a full-document replace, not a merge -- so carry forward any
     extra fields already on this record (like an attached photo) or they'd
     be silently wiped the next time the status dot is clicked. */
  const existing = progress[key] || {};
  if(!dbNs){
    if(status==="not_started"){ delete progress[key]; } else {
      progress[key] = Object.assign({}, existing, {scoutId, topicId, status, updatedBy: EDITOR_NAME||null, updatedAt});
    }
    render(); return;
  }
  try{
    const ref = dbNs.doc("progress/"+key);
    if(status==="not_started"){ await ref.delete(); }
    else { await ref.set(Object.assign({}, existing, {scoutId, topicId, status, updatedBy: EDITOR_NAME||null, updatedAt})); }
  }catch(e){ showTransientError(); }
}

function storeFor(collection){
  return {scouts, topics, ranks, categories, catItems, schedules, scheduleBlocks, scheduleTemplates, attendance, patrols, patrolPoints, reqChecks, activityLog}[collection];
}
async function upsertDoc(collection, id, data){
  if(!dbNs){
    const store = storeFor(collection);
    data.id = id;
    store[id] = Object.assign({}, store[id], data);
    render(); return;
  }
  try{ await dbNs.doc(collection+"/"+id).set(data); }catch(e){ showTransientError(); }
}
async function mergeDoc(collection, id, data){
  if(!dbNs){
    const store = storeFor(collection);
    store[id] = Object.assign({}, store[id], data);
    render(); return;
  }
  try{ await dbNs.doc(collection+"/"+id).update(data); }catch(e){ showTransientError(); }
}
async function deleteDoc(collection, id){
  if(!dbNs){
    delete storeFor(collection)[id];
    render(); return;
  }
  try{ await dbNs.doc(collection+"/"+id).delete(); }catch(e){ showTransientError(); }
}
async function deleteWhere(collection, field, value){
  const store = storeFor(collection);
  const ids = Object.values(store).filter(x=>x[field]===value).map(x=>x.id);
  for(const id of ids){ await deleteDoc(collection, id); }
}
