/* Custom confirm dialog — native window.confirm() is unreliable inside the
   sandboxed artifact frame (it can silently no-op), so every destructive
   action routes through this instead. */
function confirmAction(message, onYes){
  const root = document.createElement("div");
  root.className = "modal-backdrop";
  root.style.zIndex = "80";
  root.innerHTML = `
    <div class="modal" style="max-width:360px">
      <div style="font-size:.88rem; line-height:1.5; margin-bottom:16px">${esc(message)}</div>
      <div class="modal-actions">
        <button class="btn" data-action="__confirmNo">${esc(t('confirmNo'))}</button>
        <button class="btn danger" data-action="__confirmYes">${esc(t('confirmYes'))}</button>
      </div>
    </div>`;
  document.body.appendChild(root);
  function close(){ root.remove(); }
  root.querySelector('[data-action="__confirmNo"]').addEventListener("click", close);
  root.querySelector('[data-action="__confirmYes"]').addEventListener("click", ()=>{ close(); onYes(); });
  root.addEventListener("click", (e)=>{ if(e.target===root) close(); });
}

/* Books open as a direct new-tab link rather than an in-page iframe lightbox.
   An <iframe> nested inside the artifact's own (sandboxed) page reliably fails
   to render PDFs — Chrome's built-in PDF viewer refuses to run inside a frame
   that lacks the "allow-same-origin" permission, and it fails silently (the
   iframe just stays blank, no error event ever fires). That happened with the
   external host's PDF and kept happening once the PDF was hosted same-origin,
   because the constraint is the artifact's own sandboxing, not the file's
   origin. A plain new-tab link opens a normal, unsandboxed browser tab, where
   the native PDF viewer always works. */

/* Small celebration when a scout hits 100% on a rank. */
function prefersReducedMotion(){
  try{ return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }catch(e){ return false; }
}
let sharedAudioCtx = null;
function playCelebrationChime(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    if(!sharedAudioCtx) sharedAudioCtx = new Ctx();
    const ctx = sharedAudioCtx;
    if(ctx.state === "suspended") ctx.resume().catch(()=>{});
    const notes = [523.25, 659.25, 783.99]; /* a bright little C-E-G arpeggio */
    const now = ctx.currentTime;
    notes.forEach((freq, i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      const start = now + i*0.09;
      const end = start + 0.3;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.18, start+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, end);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(start); osc.stop(end+0.02);
    });
  }catch(e){ /* sound is a nice-to-have, never worth breaking the celebration over */ }
}
function triggerHapticBuzz(){
  try{ if(navigator.vibrate) navigator.vibrate([30,40,30,40,90]); }catch(e){}
}
/* The rank-up trail lives on the avatar ring itself (see the .ranking-up
   CSS and avatarRingHtml()'s fromColor param) rather than as a one-off
   overlay effect like the confetti celebration below -- it needs to survive
   a full render() (the rank <select>'s own change re-renders the scout
   detail panel) and show up in both places the ring appears (the roster
   card and the detail panel), so it's driven by render-read state instead
   of a DOM node built once and thrown away. */
function triggerRankUpTrail(scoutId, oldRankId){
  const oldRank = ranks[oldRankId];
  rankUpFromColor[scoutId] = oldRank ? oldRank.color : null;
  rankingUpScoutIds.add(scoutId);
  render();
  setTimeout(()=>{
    rankingUpScoutIds.delete(scoutId);
    delete rankUpFromColor[scoutId];
    render();
  }, 1200);
}
function triggerCelebration(scoutId, rankId){
  const s = scouts[scoutId], r = ranks[rankId];
  if(!s || !r) return;
  if(!prefersReducedMotion()) showConfetti(confettiPaletteForColor(r.color));
  playCelebrationChime();
  triggerHapticBuzz();
  const toast = document.createElement("div");
  toast.className = "celebration-toast";
  toast.textContent = t("celebrationMsg").replace("{name}", scoutDisplayName(s)).replace("{rank}", loc(r,"name"));
  document.body.appendChild(toast);
  if(prefersReducedMotion()){ toast.classList.add("show"); }
  else { requestAnimationFrame(()=> toast.classList.add("show")); }
  setTimeout(()=>{ toast.classList.remove("show"); setTimeout(()=> toast.remove(), 400); }, 3200);
}
/* Lighten (positive percent) or darken (negative) a #rrggbb color by blending it
   toward white or black. Used to build a small tonal confetti palette out of a
   single rank color instead of firing generic random colors for every rank. */
function shadeColor(hex, percent){
  if(!/^#[0-9a-fA-F]{6}$/.test(hex)) return hex;
  const clamp = v => Math.max(0, Math.min(255, Math.round(v)));
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const t2 = percent > 0 ? 255 : 0, p = Math.abs(percent);
  const mix = c => clamp(c + (t2 - c) * p);
  return "#" + [mix(r), mix(g), mix(b)].map(c=> c.toString(16).padStart(2,"0")).join("");
}
/* A rank's own color plus a lighter tint, a darker shade, and a gold sparkle accent
   -- confetti reads as "this rank's colors" rather than a generic random shower. */
function confettiPaletteForColor(hex){
  if(!hex || !/^#[0-9a-fA-F]{6}$/.test(hex)) return ["#2C5A86","#1F6B52","#5B3A94","#8A5C0A","#E6BE50","#D61616"];
  return [hex, shadeColor(hex, 0.35), shadeColor(hex, -0.3), "#E6BE50"];
}
function showConfetti(colors){

  for(let i=0;i<48;i++){

    p.style.setProperty("--rot", Math.floor(360+Math.random()*360)+"deg");

}

/* Printable per-scout rank progress report. This opens the report as its own
   standalone document in a new tab (via a Blob/object URL) and calls print()
   there, rather than calling window.print() on the current page: the artifact
   runs inside a sandboxed frame, and a sandboxed frame's "modals" (alert,
   confirm, print, prompt) are no-ops there -- clicking "Print Report" would
   silently do nothing. A real new tab is a normal, unsandboxed browsing
   context, so its own print() call works. */
/* =========================== DATA MANAGEMENT (CSV / JSON) =========================== */
function showNotice(message, isError){
  const toast = document.createElement("div");
  toast.className = "notice-toast" + (isError ? " error" : "");
  toast.textContent = message;
  document.body.appendChild(toast);
  if(prefersReducedMotion()){ toast.classList.add("show"); }
  else { requestAnimationFrame(()=> toast.classList.add("show")); }
  setTimeout(()=>{ toast.classList.remove("show"); setTimeout(()=> toast.remove(), 400); }, 3200);
}
function csvCell(v){
  const s = (v===null||v===undefined) ? "" : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function toCsv(headers, rows){
  return [headers.map(csvCell).join(",")].concat(rows.map(r=> r.map(csvCell).join(","))).join("\r\n");
}
async function getDownloadsNs(){
  try{
    if(window.claude && typeof window.claude.use === "function"){ return await window.claude.use("downloads"); }
  }catch(e){}
  return null;
}
async function saveTextFile(filename, text){
  const ns = await getDownloadsNs();
  if(ns){
    try{ await ns.save({filename, data: text}); }
    catch(e){ if(e && e.code!=="declined") showNotice(t("downloadsUnavailable"), true); }
    return;
  }
  /* Outside a Claude Artifact there's no downloads capability to ask, but a
     plain script-triggered download works completely normally once this
     page is hosted on its own origin -- it's only the Artifact preview
     sandbox that blocks those. */
  try{
    const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 4000);
  }catch(e){ showNotice(t("downloadsUnavailable"), true); }
}

const BACKUP_COLLECTIONS = ["scouts","topics","ranks","categories","catItems","schedules","scheduleBlocks","scheduleTemplates","attendance","patrols","patrolPoints","progress","reqChecks","activityLog"];
function storeForBackup(collection){
  return {scouts, topics, ranks, categories, catItems, schedules, scheduleBlocks, scheduleTemplates, attendance, patrols, patrolPoints, progress, reqChecks, activityLog}[collection];
}
function exportFullBackup(){
  const dump = {};
  BACKUP_COLLECTIONS.forEach(name=> dump[name] = storeForBackup(name) || {});
  saveTextFile("scout-tracker-backup.json", JSON.stringify(dump, null, 1));
}
function triggerImportBackup(){
  const input = document.getElementById("importFileInput");
  if(input) input.click();
}
async function importBackupRaw(collection, id, data){
  if(!dbNs){
    const store = storeForBackup(collection);
    if(!store) return;
    store[id] = Object.assign({}, store[id], data);
    return;
  }
  try{ await dbNs.doc(collection+"/"+id).set(data); }catch(e){ /* best effort per-doc */ }
}
async function handleImportFile(file){
  let parsed;
  try{
    const text = await file.text();
    parsed = JSON.parse(text);
  }catch(e){ showNotice(t("importError"), true); return; }
  if(!parsed || typeof parsed !== "object"){ showNotice(t("importError"), true); return; }
  const hasKnownCollection = BACKUP_COLLECTIONS.some(name=> parsed[name] && typeof parsed[name]==="object");
  if(!hasKnownCollection){ showNotice(t("importError"), true); return; }
  confirmAction(t("importConfirm"), async ()=>{
    for(const name of BACKUP_COLLECTIONS){
      const docs = parsed[name];
      if(!docs || typeof docs !== "object") continue;
      for(const id of Object.keys(docs)){
        await importBackupRaw(name, id, docs[id]);
      }
    }
    render();
    showNotice(t("importSuccess"), false);
  });
}

/* =========================== SEEDING =========================== */
async function seedIfEmpty(){
  if(!dbNs) return;
  try{
    const snap = await dbNs.collection("ranks").limit(1).get();
    if(!snap.empty) return;
  }catch(e){ return; }
  try{
    for(const r of SEED.ranks){ await dbNs.doc("ranks/"+r.id).set(r); }
    for(const tp of SEED.topics){ await dbNs.doc("topics/"+tp.id).set(tp); }
    for(const s of SEED.scouts){ await dbNs.doc("scouts/"+s.id).set(s); }
    for(const c of SEED.categories){ await dbNs.doc("categories/"+c.id).set(c); }
  }catch(e){ /* best effort */ }
}
function seedLocalFallback(){
  ranks = {}; topics = {}; scouts = {}; categories = {}; catItems = {};
  SEED.ranks.forEach(r=> ranks[r.id]=r);
  SEED.topics.forEach(tp=> topics[tp.id]=tp);
  SEED.scouts.forEach(s=> scouts[s.id]=s);
  SEED.categories.forEach(c=> categories[c.id]=c);
}

/* =========================== INIT =========================== */
/* Two homes for this same file: published as a Claude Artifact (where
   window.claude.use("db") is the realtime store), or self-hosted standalone
   (GitHub Pages, etc. -- no window.claude there at all). For the standalone
   case, a thin wrapper page loads the Firebase compat SDK and sets
   window.FIREBASE_CONFIG before this script runs; dbNs then becomes a real
   Firestore instance, whose doc()/collection()/get()/set()/update()/
   delete()/onSnapshot()/where()/limit() calls are exactly what the rest of
   this file already calls -- the storage code below never needed to change,
   only which backend it's pointed at. Neither path is required: with
   neither available, the app still opens read-only against SEED. */
async function init(){
  render();
  let ns = null;
  try{
    if(window.claude && typeof window.claude.use === "function"){ ns = await window.claude.use("db"); }
  }catch(e){ ns = null; }
  if(!ns && window.FIREBASE_CONFIG && window.firebase){
    try{
      if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
      await firebase.auth().signInAnonymously();
      ns = firebase.firestore();
    }catch(e){ ns = null; }
  }
  if(!ns){
    dbFailed = true; seedLocalFallback(); render(); return;
  }
  dbNs = ns;
  await seedIfEmpty();
  await migrateRanksAndColors();
  subscribeAll();
}
/* One-time-ish migration for troops whose ranks collection was already
   seeded by an earlier version of the app (seedIfEmpty() only writes into an
   EMPTY collection, so a change to SEED never reaches an existing install on
   its own). Runs on every load -- cheap and idempotent -- rather than
   tracking a "have I migrated" flag: it keeps r1-r4's color pinned to the
   current palette, and removes the two curriculum-less ranks (Vgayal/
   Araratian, r5/r6) a previous version added, reassigning any scout already
   promoted into one of them back to r4 so no scout is left pointing at a
   rank that no longer exists. */
const RANK_COLOR_UPDATES = { r1:"#C97A2E", r2:"#1F6B52", r3:"#2C5A86", r4:"#B3452F" };
const RETIRED_RANK_IDS = ["r5","r6"];
async function migrateRanksAndColors(){
  if(!dbNs) return;
  for(const [id,color] of Object.entries(RANK_COLOR_UPDATES)){
    try{ await dbNs.doc("ranks/"+id).update({color}); }catch(e){ /* rank not created yet -- seedIfEmpty already used the current SEED colors */ }
  }
  for(const rid of RETIRED_RANK_IDS){
    try{
      const scoutSnap = await dbNs.collection("scouts").where("rankId","==",rid).get();
      for(const doc of (scoutSnap.docs||[])){ await mergeDoc("scouts", doc.id, {rankId:"r4"}); }
    }catch(e){ /* best effort */ }
    try{
      const snap = await dbNs.doc("ranks/"+rid).get();
      if(snap.exists) await deleteDoc("ranks", rid);
    }catch(e){ /* best effort */ }
  }
}
function subscribeAll(){
  function watch(name){
    dbNs.collection(name).onSnapshot(snap=>{
      const next = {};
      snap.docs.forEach(d=> next[d.id] = Object.assign({id:d.id}, d.data()));
      switch(name){
        case "ranks": ranks = next; break;
        case "topics": topics = next; break;
        case "scouts": scouts = next; break;
        case "progress": progress = next; break;
        case "categories": categories = next; break;
        case "catItems": catItems = next; break;
        case "schedules": schedules = next; break;
        case "scheduleBlocks": scheduleBlocks = next; break;
        case "scheduleTemplates": scheduleTemplates = next; break;
        case "attendance": attendance = next; break;
        case "patrols": patrols = next; break;
        case "patrolPoints": patrolPoints = next; break;
        case "reqChecks": reqChecks = next; break;
        case "activityLog": activityLog = next; break;
      }
      render();
    }, ()=> showTransientError());
  }
  ["ranks","topics","scouts","progress","categories","catItems","schedules","scheduleBlocks","scheduleTemplates","attendance","patrols","patrolPoints","reqChecks","activityLog"].forEach(n=>watch(n));
}

/* =========================== RENDER: SHELL =========================== */
/* Every render() below replaces #app's innerHTML wholesale, which destroys
   and recreates any scrollable containers inside it (the schedule sidebar,
   the timeline). Browsers reset a freshly-created element's scrollTop to 0,
   which is what made "editing the schedule" (adding/dragging a block,
   toggling a sidebar group, etc.) look like it "jumps back to the top" --
   it's really just losing your place in whichever panel you'd scrolled.
   Capturing/restoring scrollTop (and the outer window scroll, for safety)
   around the rebuild fixes that without needing a real diffing renderer. */
function captureScrollState(){
  const side = document.querySelector(".sched-side");
  const tl = document.querySelector(".timeline-scroll");
  return {
    win: window.scrollY,
    side: side ? side.scrollTop : null,
    tl: tl ? tl.scrollTop : null,
  };
}
function restoreScrollState(state){
  if(!state) return;
  const side = document.querySelector(".sched-side");
  if(side && state.side!=null) side.scrollTop = state.side;
  const tl = document.querySelector(".timeline-scroll");
  if(tl && state.tl!=null) tl.scrollTop = state.tl;
  window.scrollTo(0, state.win);
}
function render(){
  const scrollState = captureScrollState();
  renderHeader();
  renderHeaderTabs();
  const app = document.getElementById("app");
  let body = renderBanner();
  if(view==="roster") body += renderRoster();
  else if(view==="curriculum") body += renderCurriculum();
  else if(view==="schedule") body += renderSchedule();
  else if(view==="attendance") body += renderAttendance();
  else if(view==="patrols") body += renderPatrols();
  else if(view==="dashboard") body += renderDashboard();
  body += '<div class="footer-note">' + esc(t("scoutsCount")) + ": " + sortedScouts().length + " · " + esc(t("topics")) + ": " + Object.keys(topics).length + "</div>";
  app.innerHTML = body;
  if(view !== lastFadedView){
    /* Only fade in on an actual tab switch, not on every data-driven
       re-render of the tab you're already looking at -- re-adding the same
       animation class needs a forced reflow in between (the offsetWidth
       read) or the browser just no-ops the second time since, as far as
       it's concerned, the class never left. */
    app.classList.remove("view-fade");
    void app.offsetWidth;
    app.classList.add("view-fade");
    lastFadedView = view;
  }
  if(activeScoutId && scouts[activeScoutId]){
    renderDetailOverlay(overlayOpenedForScout !== activeScoutId);
    overlayOpenedForScout = activeScoutId;
  } else {
    removeOverlay();
    overlayOpenedForScout = null;
  }
  bindEvents();
  if(view==="schedule") positionTimelineBlocks();
  restoreScrollState(scrollState);
  animateAvatarRings();
  if(view==="dashboard") animateDashboardCounts();
  if(pendingCelebration){ const c = pendingCelebration; pendingCelebration = null; triggerCelebration(c.scoutId, c.rankId); }
}

/* Tracks the language shown at the last render, so a genuine language
   switch can animate the toggle thumb from its old position to its new one
   -- renderHeader() rebuilds this markup from scratch every render (it's
   cheap and keeps it simple), so the thumb itself is a brand-new DOM node
   each time and needs its start position set explicitly to get a slide
   instead of a jump. */
let lastRenderedLang = null;
/* render() runs on almost every interaction anywhere in the app (a status
   click, an attendance mark, a db snapshot echoing a write back down) --
   but the header's own content only ever changes on a language switch,
   theme cycle, or editor-name commit. Rebuilding hdr.innerHTML on every one
   of those unrelated renders tears down and recreates the header's DOM
   nodes underneath the sticky/backdrop-filter layer, which reads as a
   flicker even though nothing in the header actually changed. Skip the
   rebuild entirely unless the header's own inputs changed. */
let lastRenderedHeaderSig = null;
function renderHeader(){
  const hdr = document.getElementById("hdrInner");
  const sig = LANG + "|" + THEME_MODE + "|" + DENSITY_MODE + "|" + EDITOR_NAME;
  if(sig === lastRenderedHeaderSig && hdr.childElementCount) return;
  lastRenderedHeaderSig = sig;
  const prevLang = lastRenderedLang;
  hdr.innerHTML = `
    <div class="hdr-logo">${LOGO_SVG}</div>
    <div class="hdr-brand">
      <h1>${esc(t("title"))}</h1>
      <div class="sub">${esc(t("subtitle"))}</div>
    </div>
    <div class="hdr-controls">
      <div class="editor-name" title="${esc(t("editingAsHelp"))}">
        <label>${esc(t("editingAs"))}</label>
        <input type="text" id="editorNameInput" value="${esc(EDITOR_NAME)}" placeholder="—" title="${esc(t("editingAsHelp"))}" />
      </div>
      <div class="lang-switch">
        <div class="thumb" id="langThumb"></div>
        <button data-action="setLang" data-lang="hy" class="${LANG==="hy"?"active":""}">ՀԱՅ</button>
        <button data-action="setLang" data-lang="en" class="${LANG==="en"?"active":""}">EN</button>
      </div>
      <button type="button" class="theme-toggle" data-action="cycleTheme" title="${esc(t("themeMode_"+THEME_MODE))}">${THEME_MODE==="light"?"☀️":THEME_MODE==="dark"?"🌙":"🖥️"}</button>
      <button type="button" class="theme-toggle density-toggle" data-action="cycleDensity" title="${esc(t("densityMode_"+DENSITY_MODE))}">${DENSITY_MODE==="compact"?"A−":DENSITY_MODE==="large"?"A+":"A"}</button>
      <button type="button" class="theme-toggle kbd-shortcuts-btn" data-action="openShortcutsOverlay" title="${esc(t("keyboardShortcuts"))} (?)">⌨️</button>
    </div>`;
  const editorInput = document.getElementById("editorNameInput");
  editorInput.addEventListener("change", (e)=>{
    EDITOR_NAME = e.target.value;
    try{ localStorage.setItem("araratian_editor", EDITOR_NAME); }catch(err){}
  });
  hdr.querySelectorAll("[data-action='setLang'], [data-action='cycleTheme'], [data-action='cycleDensity'], [data-action='openShortcutsOverlay']").forEach(el=> el.addEventListener("click", onAction));
  const thumb = document.getElementById("langThumb");
  const activeBtn = hdr.querySelector(".lang-switch button.active");
  if(thumb && activeBtn){
    const didSwitch = prevLang && prevLang !== LANG && !prefersReducedMotion();
    const startBtn = didSwitch ? hdr.querySelector(`.lang-switch button[data-lang="${prevLang}"]`) : null;
    if(didSwitch && startBtn){
      thumb.style.transition = "none";
      thumb.style.width = startBtn.offsetWidth + "px";
      thumb.style.left = startBtn.offsetLeft + "px";
      thumb.getBoundingClientRect(); // force reflow before re-enabling the transition
      thumb.style.transition = "";
      requestAnimationFrame(()=>{
        thumb.style.width = activeBtn.offsetWidth + "px";
        thumb.style.left = activeBtn.offsetLeft + "px";
      });
    } else {
      thumb.style.width = activeBtn.offsetWidth + "px";
      thumb.style.left = activeBtn.offsetLeft + "px";
    }
  }
  lastRenderedLang = LANG;
}

function renderBanner(){
  let html = "";
  if(dbFailed) html += `<div class="banner"><span>⚠️</span><span>${esc(t("syncOffline"))}</span></div>`;
  html += `<div class="banner err hidden" id="dbErrBanner"><span>⚠️</span><span>${esc(t("dbError"))}</span></div>`;
  return html;
}
/* Tracks the view/language shown at the last render, mirroring
   lastRenderedHeaderSig above: the vast majority of render() calls (an
   attendance mark, a status click, a db snapshot echo) don't touch which
   tab is active, so rebuilding this strip's DOM every single time tears it
   down under the sticky header for no reason and reads as a flicker. Skip
   the rebuild unless the active tab (or language, which changes the tab
   labels) actually changed. */
let lastRenderedView = null;
let lastRenderedTabsSig = null;
function renderHeaderTabs(){
  const wrap = document.getElementById("hdrTabs");
  if(!wrap) return;
  const sig = view + "|" + LANG;
  if(sig === lastRenderedTabsSig && wrap.childElementCount) return;
  lastRenderedTabsSig = sig;
  const tabs = [["roster","tabRoster"],["curriculum","tabCurriculum"],["schedule","tabSchedule"],["attendance","tabAttendance"],["patrols","tabPatrols"],["dashboard","tabDashboard"]];
  const prevView = lastRenderedView;
  wrap.innerHTML = `<div class="hdr-tabs-inner" id="hdrTabsInner">
    ${tabs.map(([id,key])=>`<button type="button" class="hdr-tab-btn ${view===id?"active":""}" data-action="setView" data-view="${id}">${esc(t(key))}</button>`).join("")}
    <div class="hdr-tabs-line"></div>
    <div class="hdr-tabs-fill" id="hdrTabsFill"></div>
  </div>`;
  wrap.querySelectorAll("[data-action='setView']").forEach(el=> el.addEventListener("click", onAction));
  const fill = document.getElementById("hdrTabsFill");
  const activeBtn = wrap.querySelector(".hdr-tab-btn.active");
  if(fill && activeBtn){
    const didSwitch = prevView && prevView !== view && !prefersReducedMotion();
    const startBtn = didSwitch ? wrap.querySelector(`.hdr-tab-btn[data-view="${prevView}"]`) : null;
    if(didSwitch && startBtn){
      fill.style.transition = "none";
      fill.style.width = startBtn.offsetWidth + "px";
      fill.style.left = startBtn.offsetLeft + "px";
      fill.getBoundingClientRect(); // force reflow before re-enabling the transition
      fill.style.transition = "";
      requestAnimationFrame(()=>{
        fill.style.width = activeBtn.offsetWidth + "px";
        fill.style.left = activeBtn.offsetLeft + "px";
      });
    } else {
      fill.style.width = activeBtn.offsetWidth + "px";
      fill.style.left = activeBtn.offsetLeft + "px";
    }
  }
  lastRenderedView = view;
}

/* =========================== RENDER: ROSTER =========================== */
function renderRoster(){
  const rlist = sortedRanks();
  let list = sortedScouts();
  if(filters.query.trim()){
    const q = filters.query.trim().toLowerCase();
    list = list.filter(s => (s.nameHy||"").toLowerCase().includes(q) || (s.nameEn||"").toLowerCase().includes(q) || roleLabel(s.roleCode).toLowerCase().includes(q));
  }
  if(filters.rankId!=="all") list = list.filter(s=> s.rankId===filters.rankId);
  if(filters.sort==="progress"){
    /* Overall advancement, not just closeness to finishing whatever rank
       they're currently on: a rank tier further along the program
       (Ayp Gark > Pen Gark > Norendza > Norakir) always outranks one
       earlier in it, and only within the same rank does % completion
       break the tie. */
    list = list.slice().sort((a,b)=> (ranks[b.rankId]?.order||0)-(ranks[a.rankId]?.order||0) || rankPercent(b.id,b.rankId)-rankPercent(a.id,a.rankId));
  } else {
    list = list.slice().sort((a,b)=> scoutDisplayName(a).localeCompare(scoutDisplayName(b), LANG==="en"?"en":"hy"));
  }

  const toolbar = `
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="${esc(t('searchPlaceholder'))}" value="${esc(filters.query)}" />
    <select id="rankFilter">
      <option value="all" ${filters.rankId==="all"?"selected":""}>${esc(t('allRanks'))}</option>
      ${rlist.map(r=>`<option value="${r.id}" ${filters.rankId===r.id?"selected":""}>${esc(loc(r,"name"))}</option>`).join("")}
    </select>
    <select id="sortSelect">
      <option value="name" ${filters.sort==="name"?"selected":""}>${esc(t('sortName'))}</option>
      <option value="progress" ${filters.sort==="progress"?"selected":""}>${esc(t('sortProgress'))}</option>
    </select>
    <button class="btn primary" data-action="addScout">${esc(t('addScout'))}</button>
  </div>`;

  if(!sortedScouts().length) return toolbar + `<div class="empty-state">${esc(t('noScouts'))}</div>`;
  if(!list.length) return toolbar + `<div class="empty-state">${esc(t('noScoutsMatch'))}</div>`;

  const cards = list.map(s=>{
    const r = ranks[s.rankId];
    const p = s.patrolId ? patrols[s.patrolId] : null;
    const pct = rankPercent(s.id, s.rankId);
    const att = attendanceSummary(s.id);
    const streak = attendanceStreak(s.id);
    const attHtml = att.total > 0 ? `
      <div class="att-mini" title="${esc(t('tabAttendance'))}">
        ${att.present ? `<span class="att-mini-chip present">${esc(t('present'))} ${att.present}</span>` : ""}
        ${att.absent ? `<span class="att-mini-chip absent">${esc(t('absent'))} ${att.absent}</span>` : ""}
        ${att.exempt ? `<span class="att-mini-chip exempt">${esc(t('exempt'))} ${att.exempt}</span>` : ""}
        ${streak>=3 ? `<span class="att-mini-chip streak" title="${esc(t('streakTooltip').replace('{n}',streak))}">🔥 ${streak}</span>` : ""}
      </div>` : "";
    return `
    <div class="scout-card" data-action="openScout" data-id="${s.id}" style="border-left-color:${esc(r?.color||'#ccc')}">
      <div class="row1">
        <div class="row1-id">
          ${avatarRingHtml(scoutInitials(s), pct, r?r.color:null, rankingUpScoutIds.has(s.id)?"ranking-up":"", rankUpFromColor[s.id])}
          <div style="min-width:0">
            <div class="scout-name">${esc(scoutDisplayName(s))}</div>
            <div class="scout-role">${s.roleCode ? esc(roleLabel(s.roleCode)) : esc(t('noRole'))}</div>
            ${p ? `<div class="scout-patrol"><span class="color-dot" style="background:${esc(p.color||'#888')}"></span>${esc(p.name)}</div>` : ""}
          </div>
        </div>
        <span class="rank-pill" style="background:${esc(r?.color||'#888')}">${esc(r?loc(r,"name"):s.rankId)}</span>
      </div>
      <div>
        ${segBarHtml(s.id, s.rankId)}
        <div class="progress-label"><span>${pct}%</span></div>
      </div>
      ${attHtml}
    </div>`;
  }).join("");
  return toolbar + `<div class="roster-grid">${cards}</div>`;
}

    const rows = tlist.map(tp=> curriculumItemRow(tp, "topic")).join("") || `<div style="color:var(--ink-dim); font-size:.8rem; padding:6px 0">—</div>`;

        <h3>${esc(loc(r,"name"))} <span style="color:var(--ink-dim); font-weight:400">— ${tlist.length} ${esc(t('topics'))}</span></h3>
        <span class="caret">›</span>
      </div>
      <div class="rank-section-body">
        ${r.bookUrl ? `<a class="book-link" href="javascript:void(0)" data-action="openBook" data-url="${esc(r.bookUrl)}">📘 ${esc(t('openBook'))}</a>` : ""}

      </div>
    </div>`;
  }).join("");

  const catBlocks = sortedCategories().map(c=>{
    const items = searching ? itemsForCategory(c.id).filter(matches) : itemsForCategory(c.id);
    if(searching && !items.length) return "";
    const isOpen = searching || openCurrCats.has(c.id);
    const rows = items.map(it=> curriculumItemRow(it, "catitem")).join("") || `<div style="color:var(--ink-dim); font-size:.8rem; padding:6px 0">—</div>`;
    return `
    <div class="rank-section ${isOpen?"open":""}">
      <div class="rank-section-head" data-action="toggleCurrCat" data-cat="${c.id}">
        <h3><span class="color-dot" style="background:${esc(c.color)}"></span> ${esc(loc(c,"name"))} <span style="color:var(--ink-dim); font-weight:400">— ${items.length} ${esc(t('topics'))}</span></h3>
        <span class="caret">›</span>
      </div>
      <div class="rank-section-body">
        <input type="text" data-catname="hy" data-cat="${c.id}" value="${esc(c.nameHy||"")}" placeholder="${esc(t('categoryName'))} (ՀԱՅ)" style="margin-bottom:6px; width:100%; border:none; background:var(--panel-2); border-radius:8px; padding:6px 9px; font-size:.82rem; color:var(--ink)" />
        <input type="text" data-catname="en" data-cat="${c.id}" value="${esc(c.nameEn||"")}" placeholder="${esc(t('categoryName'))} (EN)" style="margin-bottom:8px; width:100%; border:none; background:var(--panel-2); border-radius:8px; padding:6px 9px; font-size:.82rem; color:var(--ink)" />
        <div class="curr-cards-grid">${rows}</div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px">
          <button class="btn small gold" data-action="addCatItem" data-cat="${c.id}">${esc(t('addItem'))}</button>
          <button class="btn small danger" data-action="deleteCategory" data-id="${c.id}">${esc(t('delete'))}</button>
        </div>
      </div>
    </div>`;
  }).join("");

  return legend + searchBar + rankBlocks +
    (searching && !rankBlocks && !catBlocks ? `<div class="empty-state">${esc(t('noCurriculumMatch'))}</div>` : "") +
    `<h2 style="font-size:1rem; margin:20px 0 10px">${esc(t('otherCategories'))}</h2>` +
    catBlocks +
    `<button class="btn primary" data-action="addCategory">${esc(t('addCategory'))}</button>`;
}

function attachmentIcon(url){
  const u = (url||"").toLowerCase();
  if(/\.(png|jpe?g|gif|webp|svg)(\?|$)/.test(u)) return "🖼️";
  if(/\.(mp4|mov|webm|avi)(\?|$)/.test(u) || /youtube\.com|youtu\.be|vimeo\.com/.test(u)) return "🎬";
  if(/\.pdf(\?|$)/.test(u)) return "📄";
  if(/\.(ppt|pptx)(\?|$)/.test(u) || /docs\.google\.com\/presentation/.test(u)) return "📊";
  if(/\.(doc|docx)(\?|$)/.test(u) || /docs\.google\.com\/document/.test(u)) return "📝";
  if(/\.(xls|xlsx|csv)(\?|$)/.test(u) || /docs\.google\.com\/spreadsheets/.test(u)) return "📈";
  if(/drive\.google\.com/.test(u)) return "📁";
  return "🔗";
}
function viewerKind(url){
  const u = (url||"").toLowerCase();
  if(/\.(png|jpe?g|gif|webp|svg)(\?|$)/.test(u)) return {kind:"image"};
  if(/\.pdf(\?|$)/.test(u)) return {kind:"pdf"};
  if(/\.(mp4|mov|webm)(\?|$)/.test(u)) return {kind:"video"};
  const yt = u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]+)/);
  if(yt) return {kind:"youtube", id: yt[1]};
  const vim = u.match(/vimeo\.com\/(\d+)/);
  if(vim) return {kind:"vimeo", id: vim[1]};
  return null;
}
function openFileViewer(url, label){
  if(!url) return;
  const info = viewerKind(url);
  if(!info){ window.open(url, "_blank", "noopener"); return; }
  let body;
  if(info.kind==="image"){
    body = `<img src="${esc(url)}" style="max-width:100%; max-height:70vh; display:block; margin:0 auto; border-radius:10px" />`;
  } else if(info.kind==="pdf"){
    body = `<iframe src="${esc(url)}" style="width:100%; height:70vh; border:none; border-radius:10px; background:#fff"></iframe>`;
  } else if(info.kind==="video"){
    body = `<video src="${esc(url)}" controls style="width:100%; max-height:70vh; border-radius:10px; background:#000"></video>`;
  } else if(info.kind==="youtube"){
    body = `<iframe src="https://www.youtube.com/embed/${esc(info.id)}" style="width:100%; height:70vh; border:none; border-radius:10px" allowfullscreen></iframe>`;
  } else if(info.kind==="vimeo"){
    body = `<iframe src="https://player.vimeo.com/video/${esc(info.id)}" style="width:100%; height:70vh; border:none; border-radius:10px" allowfullscreen></iframe>`;
  }
  const root = document.getElementById("modalRoot");
  root.classList.remove("hidden");
  root.innerHTML = `<div class="modal file-viewer-modal">
    <h3>${esc(label||"")}</h3>
    ${body}
    <div class="modal-actions">
      <a class="btn" href="${esc(url)}" target="_blank" rel="noopener">${esc(t('openExternally'))} ↗</a>
      <button class="btn" data-action="closeModal">${esc(t('close'))}</button>
    </div>
  </div>`;
  root.querySelector("[data-action='closeModal']").addEventListener("click", closeModal);
  root.addEventListener("click", (e2)=>{ if(e2.target===root) closeModal(); });
}
function attachmentChipsHtml(item, kind, editable){

  const chips = list.map(a=> `

      <a href="javascript:void(0)" data-action="openAttachment" data-url="${esc(a.url)}" data-label="${esc(a.label || a.url)}">${attachmentIcon(a.url)} ${esc(a.label || a.url)}</a>
      ${editable ? `<button type="button" class="attach-x" data-action="removeAttachment" data-kind="${kind}" data-id="${item.id}" data-aid="${a.id}" title="${esc(t('removeAttachment'))}">✕</button>` : ""}

  const addBtn = editable ? `<button type="button" class="btn small ghost" data-action="addAttachment" data-kind="${kind}" data-id="${item.id}">📎 ${esc(t('addAttachment'))}</button>` : "";
  return `<div class="attach-row">${chips}${addBtn}</div>`;

function renderSchedule(){
  const scheds = sortedSchedulesForDate(scheduleDate);
  if(!activeScheduleId || !scheds.find(s=>s.id===activeScheduleId)){
    activeScheduleId = scheds.length ? scheds[0].id : null;
  }
  const pills = scheds.map(s=>`<button class="sched-pill ${s.id===activeScheduleId?"active":""}" data-action="pickSchedule" data-id="${s.id}">${esc(s.label||t('tabSchedule'))}</button>`).join("");

  const toolbar = `
  <div class="toolbar">
    <label style="font-size:.8rem; color:var(--ink-dim); display:flex; align-items:center; gap:6px">${esc(t('date'))}
      <input type="date" id="scheduleDateInput" value="${esc(scheduleDate)}" />
    </label>
    ${sessionNavHtml(scheduleDate, "stepScheduleDate", "scheduleDateJump")}
    <button class="btn primary" data-action="addSchedule">${esc(t('addSchedule'))}</button>
    ${activeScheduleId && scheduleDate===todayStr() && scheduleViewMode==="timeline" ? `<button class="btn small" data-action="jumpToNow">${esc(t('jumpToNow'))}</button>` : ""}
    ${activeScheduleId ? `<button class="btn small" data-action="printSessionPlan" data-id="${activeScheduleId}">🖨 ${esc(t('printSessionPlan'))}</button>` : ""}
    ${activeScheduleId ? `<button class="btn danger small" data-action="deleteSchedule" data-id="${activeScheduleId}">${esc(t('delete'))}</button>` : ""}
    <div class="sched-view-toggle" role="group" aria-label="${esc(t('scheduleViewMode'))}">
      <button class="sched-view-btn ${scheduleViewMode==="timeline"?"active":""}" data-action="setScheduleViewMode" data-mode="timeline" title="${esc(t('timelineView'))}">📅 ${esc(t('timelineView'))}</button>
      <button class="sched-view-btn ${scheduleViewMode==="list"?"active":""}" data-action="setScheduleViewMode" data-mode="list" title="${esc(t('listView'))}">📋 ${esc(t('listView'))}</button>
    </div>
  </div>
  <div class="sched-pills">${pills}</div>`;

  if(!activeScheduleId){
    return toolbar + `<div class="empty-state">${esc(t('noBlocks'))}</div>`;
  }

  const activeSched = schedules[activeScheduleId];
  const templateBar = `
  <div class="template-bar">
    <select id="templateApplySelect">
      <option value="">${esc(t('chooseTemplate'))}</option>
      ${sortedScheduleTemplates().map(tpl=>`<option value="${tpl.id}">${esc(tpl.name)}</option>`).join("")}
    </select>
    <button class="btn small" data-action="saveAsTemplate">${esc(t('saveAsTemplate'))}</button>
    ${sortedScheduleTemplates().map(tpl=>`<span class="template-chip">${esc(tpl.name)}<button class="tc-x" data-action="deleteTemplate" data-id="${tpl.id}" title="${esc(t('delete'))}">✕</button></span>`).join("")}
  </div>
  <div class="richtext-wrap">
    ${richTextToolbarHtml("sessionNotesInput")}
    <textarea id="sessionNotesInput" class="session-notes" placeholder="${esc(t('sessionNotesPlaceholder'))}" rows="2">${esc(activeSched?(activeSched.notes||""):"")}</textarea>
    <div class="richtext-preview" id="sessionNotesInputPreview"></div>
  </div>`;

  const rlist = sortedRanks();
  const q = schedSourceQuery.trim().toLowerCase();
  const searching = q.length > 0;
  function sourceGroup(groupKey, colorDot, label, items, kind){
    const filtered = q ? items.filter(it => loc(it,"title").toLowerCase().includes(q)) : items;
    if(q && !filtered.length) return "";
    const isOpen = searching || openSchedSourceGroups.has(groupKey);
    const chips = filtered.map(it=>`<div class="source-chip" draggable="true" data-action="addBlockFromSource" data-kind="${kind}" data-source="${it.id}"><span class="color-dot" style="background:${esc(colorDot(it))}"></span>${esc(loc(it,"title"))}</div>`).join("")
      || `<div style="color:var(--ink-dim); font-size:.75rem; padding:4px 0">—</div>`;
    return `
    <div class="sched-side-block ${isOpen?"open":""}">
      <h4 data-action="toggleSchedSourceGroup" data-group="${groupKey}">
        <span>${label} <span style="font-weight:400; opacity:.7">(${filtered.length})</span></span>
        <span class="caret">›</span>
      </h4>
      <div class="sched-side-block-body">${chips}</div>
    </div>`;
  }
  const sideRanks = rlist.map(r=>
    sourceGroup("rank:"+r.id, ()=>r.color, esc(loc(r,"name")), topicsForRank(r.id), "rank")
  ).join("");
  const sideCats = sortedCategories().map(c=>{
    const items = itemsForCategory(c.id);
    if(!items.length && !q) return "";
    return sourceGroup("cat:"+c.id, ()=>c.color, esc(loc(c,"name")), items, "category");
  }).join("");
  const searchBar = `<input type="text" id="schedSourceSearch" class="sched-search-input" placeholder="${esc(t('schedSearchPlaceholder'))}" value="${esc(schedSourceQuery)}" />`;

  const blocks = blocksForSchedule(activeScheduleId);
  // Bulk selection only makes sense against blocks in the schedule currently
  // on screen -- drop any id that no longer belongs (schedule switched, date
  // changed, or the block itself was deleted) rather than let it linger.
  const validBlockIds = new Set(blocks.map(b=>b.id));
  for(const id of Array.from(selectedBlockIds)) if(!validBlockIds.has(id)) selectedBlockIds.delete(id);
  const hourRows = [];
  for(let m=DAY_START; m<=DAY_END; m+=60){
    const top = (m-DAY_START)*PX_PER_MIN;
    const hh = String(Math.floor(m/60)).padStart(2,"0");
    hourRows.push(`<div class="tl-hour-row" style="top:${top}px"><span class="tl-hour-label">${hh}:00</span></div>`);
  }
  const totalHeight = (DAY_END-DAY_START)*PX_PER_MIN;
  const blockEls = blocks.map(b=>{
    const top = (b.startMin-DAY_START)*PX_PER_MIN;
    const h = Math.max(18, b.durationMin*PX_PER_MIN);
    const startLbl = minLabel(b.startMin), endLbl = minLabel(b.startMin+b.durationMin);
    const bg = b.color||'#0C3953';
    const fg = contrastTextColor(bg);
    const grip = fg==="#fff" ? "rgba(255,255,255,.6)" : "rgba(0,0,0,.3)";
    const isSelected = selectedBlockIds.has(b.id);
    return `
    <div class="tl-block ${isSelected?"selected":""}" data-block="${b.id}" style="top:${top}px; height:${h}px; background:${esc(bg)}; color:${fg}; --grip:${grip}">
      <button type="button" class="tl-select-toggle" data-action="toggleBlockSelection" data-block="${b.id}" title="${esc(t('selectBlockTitle'))}">${isSelected?"✓":""}</button>
      <div class="tb-title">${esc(blockDisplayTitle(b))}</div>
      <div class="tb-time">${startLbl}–${endLbl}</div>
      <div class="tl-resize" data-resize="${b.id}"></div>
    </div>`;
  }).join("");

  /* List view: the same blocks as plain sorted rows with move-up/down, edit
     (tap the row, same modal the timeline uses) and delete controls -- an
     alternative that doesn't need a drag gesture at all, easier to scan on a
     small phone screen and friendlier for anyone who finds the timeline's
     drag interaction awkward. */
  const listRows = blocks.map((b, i)=>{
    const startLbl = minLabel(b.startMin), endLbl = minLabel(b.startMin+b.durationMin);
    const bg = b.color||'#0C3953';
    const isSelected = selectedBlockIds.has(b.id);
    return `
    <div class="sched-list-row ${isSelected?"selected":""}" data-block="${b.id}">
      <input type="checkbox" class="sched-list-check" data-action="toggleBlockSelection" data-block="${b.id}" title="${esc(t('selectBlockTitle'))}" ${isSelected?"checked":""} />
      <span class="sched-list-swatch" style="background:${esc(bg)}"></span>
      <div class="sched-list-main" data-action="openBlockModal" data-id="${b.id}">
        <div class="sched-list-title">${esc(blockDisplayTitle(b))}</div>
        <div class="sched-list-time">${startLbl}–${endLbl}</div>
      </div>
      <div class="sched-list-controls">
        <button type="button" class="sched-list-arrow" data-action="moveBlockInList" data-block="${b.id}" data-dir="-1" title="${esc(t('moveBlockUp'))}" ${i===0?"disabled":""}>▲</button>
        <button type="button" class="sched-list-arrow" data-action="moveBlockInList" data-block="${b.id}" data-dir="1" title="${esc(t('moveBlockDown'))}" ${i===blocks.length-1?"disabled":""}>▼</button>
        <button type="button" class="sched-list-arrow danger" data-action="deleteBlockFromList" data-block="${b.id}" title="${esc(t('delete'))}">✕</button>
      </div>
    </div>`;
  }).join("") || `<div class="empty-state">${esc(t('emptySchedList'))}</div>`;

  const mainPaneHtml = scheduleViewMode === "list"
    ? `<div class="sched-list">${listRows}</div>`
    : `
    <div class="timeline-wrap">
      <div class="timeline-scroll">
        <div class="timeline" id="timelineEl" style="height:${totalHeight}px">
          ${hourRows.join("")}
          ${blockEls}
          ${nowLineHtml(scheduleDate)}
        </div>
      </div>
    </div>`;

  return toolbar + templateBar + bulkSelectionBarHtml() + `
  <div class="sched-layout">
    <div class="sched-side">
      <div class="sched-side-block" style="background:transparent; box-shadow:none; padding:0">
        <button class="btn primary" style="width:100%" data-action="openBlockModal">${esc(t('addBlock'))}</button>
      </div>
      ${searchBar}
      <div style="font-size:.72rem; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-dim); margin:8px 0 4px">${esc(t('fromCurriculum'))}</div>
      ${sideRanks}
      ${sideCats ? `<div style="font-size:.72rem; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-dim); margin:8px 0 4px">${esc(t('fromCategories'))}</div>${sideCats}` : ""}
    </div>
    ${mainPaneHtml}
  </div>`;
}
/* The 8-swatch quick-recolor strip is a curated spread across the 24-color
   palette (every 3rd swatch) rather than all 24 -- enough variety for a bulk
   action without turning the bar itself into a wall of color chips. */
const BULK_RECOLOR_SWATCHES = [0,3,6,9,12,15,18,21].map(i=>CATEGORY_SWATCHES[i]);
function bulkSelectionBarHtml(){
  if(selectedBlockIds.size === 0) return "";
  const swatchHtml = BULK_RECOLOR_SWATCHES.map(c=>
    `<span class="bulk-select-swatch" style="background:${esc(c)}" data-action="bulkRecolorBlocks" data-color="${esc(c)}" title="${esc(t('recolorSelected'))}"></span>`
  ).join("");
  return `
  <div class="bulk-select-bar">
    <span class="bsb-count">${selectedBlockIds.size} ${esc(t('selectedCount'))}</span>
    <div class="bulk-select-swatches">${swatchHtml}</div>
    <button type="button" class="btn small danger" data-action="bulkDeleteBlocks">${esc(t('deleteSelected'))}</button>
    <button type="button" class="btn small" data-action="clearBlockSelection">${esc(t('cancelSelection'))}</button>
  </div>`;
}
function minLabel(m){
  m = Math.max(0, Math.round(m));
  const hh = String(Math.floor(m/60)).padStart(2,"0");
  const mm = String(m%60).padStart(2,"0");
  return hh+":"+mm;
}
function contrastTextColor(hex){
  if(!/^#[0-9a-fA-F]{6}$/.test(hex)) return "#fff";
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const yiq = (r*299 + g*587 + b*114) / 1000;
  return yiq >= 150 ? "var(--ink)" : "#fff";
}
function nowLineHtml(dateStr){
  if(dateStr !== todayStr()) return "";
  return `<div class="tl-now-line" id="tlNowLine"></div>`;
}
function updateNowLine(){
  const line = document.getElementById("tlNowLine");
  if(!line) return;
  if(scheduleDate !== todayStr()){ line.style.display = "none"; return; }
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  if(nowMin < DAY_START || nowMin > DAY_END){ line.style.display = "none"; return; }
  line.style.display = "block";
  line.style.top = ((nowMin-DAY_START)*PX_PER_MIN) + "px";
}
setInterval(updateNowLine, 30000);
/* Scrolls the timeline so "now" is comfortably in view, the way opening
   Google Calendar's day view drops you near the current time instead of at
   the top of the day. Runs once per (date, schedule) pair -- guarded by
   autoScrolledScheduleKey -- so it doesn't keep yanking the view back to
   "now" every time something re-renders while you're scrolled elsewhere on
   purpose (editing an evening block, say). */
function scrollTimelineToNow(force, smooth){
  const tl = document.querySelector(".timeline-scroll");
  const line = document.getElementById("tlNowLine");
  if(!tl || !line) return;
  if(line.style.display === "none" && !force) return;
  const top = parseFloat(line.style.top || "0");
  const target = Math.max(0, top - tl.clientHeight/3);
  if(smooth && !prefersReducedMotion()) tl.scrollTo({top: target, behavior: "smooth"});
  else tl.scrollTop = target;
}
function maybeAutoScrollToNow(){
  if(scheduleViewMode !== "timeline") return; // nothing to scroll in list view; don't consume the once-per-schedule key
  if(scheduleDate !== todayStr()) return;
  const key = scheduleDate + "|" + activeScheduleId;
  if(autoScrolledScheduleKey === key) return;
  autoScrolledScheduleKey = key;
  scrollTimelineToNow(false, false);
}
function positionTimelineBlocks(){ updateNowLine(); maybeAutoScrollToNow(); }

/* =========================== RENDER: ATTENDANCE =========================== */
function attendanceStatsForDate(dateStr, list){
  let present=0, marked=0;
  list.forEach(s=>{
    const rec = attendance[dateStr+"__"+s.id];
    if(rec){ marked++; if(rec.status==="present") present++; }
  });
  return { present, marked, rate: marked ? present/marked : null };
}
function attendanceHeatmapHtml(list){
  const [y,m] = attendanceHeatmapMonth.split("-").map(Number);
  const first = new Date(y, m-1, 1);
  const startOffset = first.getDay();
  const daysCount = new Date(y, m, 0).getDate();
  let monthLabel = attendanceHeatmapMonth;
  try{ monthLabel = new Intl.DateTimeFormat(LANG==="en"?"en-US":"hy", {month:"long", year:"numeric"}).format(first); }catch(e){}
  const weekdayLabels = [...Array(7)].map((_,i)=>{
    try{ return new Intl.DateTimeFormat(LANG==="en"?"en-US":"hy", {weekday:"narrow"}).format(new Date(2023,0,1+i)); }catch(e){ return ""; }
  });
  let cells = "";
  for(let i=0;i<startOffset;i++) cells += `<div class="heat-cell empty"></div>`;
  const today = todayStr();
  for(let d=1; d<=daysCount; d++){
    const dateStr = `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const {present, marked, rate} = attendanceStatsForDate(dateStr, list);
    const isToday = dateStr === today;
    const isSelected = dateStr === attendanceDate;
    let style;
    if(rate===null){ style = "background:var(--panel-2)"; }
    else {
      const alpha = Math.round((0.18 + rate*0.82)*100);
      const hue = rate >= 0.9 ? "var(--st-done)" : rate >= 0.5 ? "var(--st-prog)" : "var(--st-weak)";
      style = `background:color-mix(in srgb, ${hue} ${alpha}%, transparent)`;
    }
    const titleAttr = rate!==null ? `${dateStr} · ${present}/${marked} ${t('present').toLowerCase()} · ${Math.round(rate*100)}%` : dateStr;
    const countHtml = marked ? `<span class="heat-day-count">${present}👤</span>` : "";
    cells += `<div class="heat-cell ${isToday?'today':''} ${isSelected?'selected':''}" data-action="heatmapPickDay" data-date="${dateStr}" style="${style}" title="${esc(titleAttr)}"><span class="heat-day-num">${d}</span>${countHtml}</div>`;
  }
  return `
  <div class="att-heatmap">
    <div class="heat-head">
      <button type="button" class="btn small" data-action="heatmapPrevMonth">‹</button>
      <span class="heat-month-label">${esc(monthLabel)}</span>
      <button type="button" class="btn small" data-action="heatmapNextMonth">›</button>
    </div>
    <div class="heat-grid heat-weekdays">${weekdayLabels.map(w=>`<div class="heat-wd">${esc(w)}</div>`).join("")}</div>
    <div class="heat-grid">${cells}</div>
  </div>`;
}

/* =========================== RENDER: PATROLS =========================== */
function patrolLeaderboardHtml(list){
  if(list.length < 2) return "";
  const ranked = list.map(p=> ({p, total: patrolTotal(p.id)})).sort((a,b)=> b.total-a.total);
  // Positive and negative totals are scaled against their own side's max, each
  // capped at 46% of the track so the bar grows out from a center zero-line
  // instead of end-to-end -- see the .lb-bar-track comment in the CSS for why.
  const maxPos = Math.max(1, ...ranked.map(r=> Math.max(0, r.total)));
  const maxNeg = Math.max(1, ...ranked.map(r=> Math.max(0, -r.total)));
  const medals = ["🥇","🥈","🥉"];
  const rows = ranked.map((r,i)=>{
    const isNeg = r.total < 0;
    const pct = r.total===0 ? 0 : Math.max(4, Math.round((isNeg ? -r.total/maxNeg : r.total/maxPos) * 46));
    const barStyle = isNeg
      ? `width:${pct}%; right:50%; background:var(--st-weak)`
      : `width:${pct}%; left:50%; background:${esc(r.p.color||'#888')}`;
    return `
    <div class="leaderboard-row">
      <span class="lb-rank">${medals[i]||(i+1)}</span>
      <span class="color-dot" style="background:${esc(r.p.color||'#888')}"></span>
      <span class="lb-name">${esc(r.p.name)}</span>
      <div class="lb-bar-track"><span class="lb-bar-zero"></span><div class="lb-bar-fill ${isNeg?'neg':''}" style="${barStyle}"></div></div>
      <span class="lb-total ${isNeg?'neg':''}">${r.total>0?'+':''}${r.total}</span>
    </div>`;
  }).join("");
  return `<div class="leaderboard"><h3>${esc(t('leaderboardTitle'))}</h3>${rows}</div>`;
}

function lastPresentDate(scoutId){
  const dates = allSessionDates();
  for(let i=dates.length-1;i>=0;i--){
    const rec = attendance[dates[i]+"__"+scoutId];
    if(rec && rec.status==="present") return dates[i];
  }
  return null;
}
function recentActivity(limit){
  const items = [];
  Object.values(progress).forEach(p=>{
    if(!p.updatedAt) return;
    const tp = topics[p.topicId], s = scouts[p.scoutId];
    if(!tp || !s) return;
    items.push({ ts: p.updatedAt, by: p.updatedBy, text: t("activityProgress").replace("{scout}", scoutDisplayName(s)).replace("{topic}", loc(tp,"title")).replace("{status}", t(STATUS_META[p.status].labelKey)) });
  });
  Object.values(attendance).forEach(a=>{
    if(!a.updatedAt) return;
    const s = scouts[a.scoutId]; if(!s) return;
    items.push({ ts: a.updatedAt, by: a.updatedBy, text: t("activityAttendance").replace("{scout}", scoutDisplayName(s)).replace("{status}", t(a.status)) });
  });
  Object.values(activityLog).forEach(a=>{
    if(!a.ts || !a.text) return;
    items.push({ ts: a.ts, by: a.by, text: a.text });
  });
  items.sort((a,b)=> new Date(b.ts) - new Date(a.ts));
  return items.slice(0, limit||18);
}

/* =========================== EVENTS =========================== */
function debounce(fn, ms){ let h; return function(...args){ clearTimeout(h); h=setTimeout(()=>fn.apply(this,args), ms); }; }

function bindEvents(){
  const app = document.getElementById("app");
  wireRichTextToolbars(app);

  const searchInput = document.getElementById("searchInput");
  if(searchInput){
    searchInput.addEventListener("input", debounce((e)=>{
      filters.query = e.target.value; render();
      const el = document.getElementById("searchInput");
      if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }, 180));
  }
  const rankFilter = document.getElementById("rankFilter");
  if(rankFilter) rankFilter.addEventListener("change", (e)=>{ filters.rankId = e.target.value; render(); });
  const sortSelect = document.getElementById("sortSelect");
  if(sortSelect) sortSelect.addEventListener("change", (e)=>{ filters.sort = e.target.value; render(); });

  const schedSourceSearch = document.getElementById("schedSourceSearch");
  if(schedSourceSearch){
    schedSourceSearch.addEventListener("input", debounce((e)=>{
      schedSourceQuery = e.target.value; render();
      const el = document.getElementById("schedSourceSearch");
      if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }, 180));
  }
  const curriculumSearchInput = document.getElementById("curriculumSearchInput");
  if(curriculumSearchInput){
    curriculumSearchInput.addEventListener("input", debounce((e)=>{
      curriculumQuery = e.target.value; render();
      const el = document.getElementById("curriculumSearchInput");
      if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }, 180));
  }
  const schedDateInput = document.getElementById("scheduleDateInput");
  if(schedDateInput) schedDateInput.addEventListener("change", (e)=>{ scheduleDate = e.target.value; activeScheduleId = null; render(); });

function onAction(e){
  const el = e.currentTarget;
  const action = el.dataset.action;
  if(action==="setLang"){ LANG = el.dataset.lang; try{ localStorage.setItem("araratian_lang", LANG); }catch(err){} render(); }
  else if(action==="cycleTheme"){
    THEME_MODE = THEME_MODE==="auto" ? "light" : THEME_MODE==="light" ? "dark" : "auto";
    try{ localStorage.setItem("araratian_theme", THEME_MODE); }catch(err){}
    applyThemeMode();
    render();
  }
  else if(action==="cycleDensity"){
    const idx = DENSITY_ORDER.indexOf(DENSITY_MODE);
    DENSITY_MODE = DENSITY_ORDER[(idx+1) % DENSITY_ORDER.length];
    try{ localStorage.setItem("araratian_density", DENSITY_MODE); }catch(err){}
    applyDensityMode();
    render();
  }
  else if(action==="setView"){ view = el.dataset.view; render(); }
  else if(action==="openShortcutsOverlay"){ shortcutsOverlayOpen ? closeShortcutsOverlay() : openShortcutsOverlay(); }
  else if(action==="openScout"){ activeScoutId = el.dataset.id; render(); }
  else if(action==="closeScout"){ activeScoutId = null; render(); }
  else if(action==="deleteScout"){
    confirmAction(t("deleteScoutConfirm"), ()=>{
      const s = scouts[el.dataset.id];
      if(s) logActivity(t("activityScoutDeleted").replace("{scout}", scoutDisplayName(s)));
      deleteDoc("scouts", el.dataset.id); activeScoutId = null; render();
    });
  }
  else if(action==="addScout"){ openAddScoutModal(); }
  else if(action==="openBook"){ openFileViewer(el.dataset.url, t('openBook')); }
  else if(action==="openAttachment"){ openFileViewer(el.dataset.url, el.dataset.label || el.dataset.url); }
  else if(action==="cycleStatus"){
    const scoutId = el.dataset.scout, topicId = el.dataset.topic;
    const cur = statusFor(scoutId, topicId);
    const newStatus = STATUS_ORDER[(STATUS_ORDER.indexOf(cur)+1) % STATUS_ORDER.length];
    /* Decide whether this exact change will complete the rank BEFORE dispatching
       the write -- the write may round-trip through the database asynchronously,
       so we can't reliably read the "after" state back off `progress` once it
       resolves. Simulating the one-topic change locally is deterministic
       regardless of db timing, and render() fires the celebration once the
       100% state actually appears on screen. */
    const tp = topics[topicId];
    if(tp){
      const list = topicsForRank(tp.rankId);
      const beforePct = rankPercent(scoutId, tp.rankId);
      const counts = {not_started:0, weak:0, in_progress:0, mastered:0};
      list.forEach(t2=> counts[t2.id===topicId ? newStatus : statusFor(scoutId, t2.id)]++);
      let sum = 0; Object.keys(counts).forEach(k=> sum += counts[k]*STATUS_META[k].weight);
      const afterPct = list.length ? Math.round(sum/list.length) : 0;
      if(beforePct < 100 && afterPct === 100){ pendingCelebration = {scoutId, rankId: tp.rankId}; }
      const scoutForPts = scouts[scoutId];
      if(scoutForPts && scoutForPts.patrolId){
        if(newStatus==="mastered" && cur!=="mastered"){
          awardAutoPoints(scoutForPts.patrolId, 1, "ptReasonTopic", {scout: scoutDisplayName(scoutForPts), topic: loc(tp,"title")}, "topic__"+scoutId+"__"+topicId);
        }
        if(beforePct < 100 && afterPct === 100){
          const r = ranks[tp.rankId];
          awardAutoPoints(scoutForPts.patrolId, 10, "ptReasonRank", {scout: scoutDisplayName(scoutForPts), rank: r?loc(r,"name"):""}, "rankcomplete__"+scoutId+"__"+tp.rankId);
        }
      }
    }
    /* Set the pulse flag BEFORE writing: a local/mock backend's onSnapshot
       can fire synchronously inside setStatus() (before this call even
       returns), so the flag has to already be in place for that render to
       pick it up -- setting it after would always miss the first paint. */
    const pulseKey = scoutId+"__"+topicId;
    justChangedKey = pulseKey;
    setStatus(scoutId, topicId, newStatus);
    setTimeout(()=>{ if(justChangedKey===pulseKey){ justChangedKey = null; render(); } }, 380);
  }
  else if(action==="toggleReqCheck"){
    const scoutId = el.dataset.scout, rankId = el.dataset.rank, reqKey = el.dataset.req;
    const checked = el.checked;
    const id = reqCheckKey(scoutId, rankId, reqKey);
    upsertDoc("reqChecks", id, {id, scoutId, rankId, reqKey, checked, updatedBy: EDITOR_NAME||null, updatedAt: new Date().toISOString()});
    const s = scouts[scoutId], r = ranks[rankId];
    if(s && r) logActivity(t(checked?"activityReqChecked":"activityReqUnchecked").replace("{req}", t(reqKey)).replace("{scout}", scoutDisplayName(s)).replace("{rank}", loc(r,"name")));
  }
  else if(action==="triggerTopicPhoto"){
    const input = el.parentElement.querySelector(".topic-photo-input");
    if(input) input.click();
  }
  else if(action==="removeTopicPhoto"){
    const key = progressKey(el.dataset.scout, el.dataset.topic);
    mergeDoc("progress", key, {photo: null});
  }
  else if(action==="viewTopicPhoto"){
    const prog = progress[progressKey(el.dataset.scout, el.dataset.topic)];
    if(prog && prog.photo){
      const root = document.getElementById("modalRoot");
      root.classList.remove("hidden");
      root.innerHTML = `<div class="modal" style="max-width:520px; text-align:center">
        <img src="${esc(prog.photo)}" style="max-width:100%; border-radius:10px" />
        <div class="modal-actions" style="justify-content:center; margin-top:12px">
          <button class="btn" data-action="closeModal">${esc(t('close'))}</button>
        </div>
      </div>`;
      root.querySelector("[data-action='closeModal']").addEventListener("click", closeModal);
      root.addEventListener("click", (e2)=>{ if(e2.target===root) closeModal(); });
    }
  }
  else if(action==="toggleTopicDetail"){
    const key = el.dataset.scout+"__"+el.dataset.topic;
    openTopicDetails.has(key) ? openTopicDetails.delete(key) : openTopicDetails.add(key);
    render();
  }
  else if(action==="toggleRankSection"){
    const id = el.dataset.rank;

    render();
  }
  else if(action==="toggleCurrRank"){
    const id = el.dataset.rank;
    openCurrRanks.has(id) ? openCurrRanks.delete(id) : openCurrRanks.add(id);
    render();
  }
  else if(action==="toggleCurrCat"){
    const id = el.dataset.cat;
    openCurrCats.has(id) ? openCurrCats.delete(id) : openCurrCats.add(id);
    render();
  }
  else if(action==="editTopic"){ editingTopicId = el.dataset.id; render(); }
  else if(action==="doneEditTopic"){ editingTopicId = null; render(); }
  else if(action==="editCatItem"){ editingCatItemId = el.dataset.id; render(); }
  else if(action==="doneEditCatItem"){ editingCatItemId = null; render(); }
  else if(action==="addAttachment"){ openAttachmentModal(el.dataset.kind, el.dataset.id); }
  else if(action==="removeAttachment"){

  else if(action==="deleteTopic"){

      const tp = topics[el.dataset.id];
      if(tp) logActivity(t("activityTopicDeleted").replace("{title}", loc(tp,"title")));
      deleteDoc("topics", el.dataset.id); render();
    });
  }
  else if(action==="addCategory"){ openAddCategoryModal(); }
  else if(action==="deleteCategory"){
    confirmAction(t("deleteCategoryConfirm"), ()=>{

      if(c) logActivity(t("activityCategoryDeleted").replace("{name}", loc(c,"name")));
      deleteWhere("catItems","categoryId", el.dataset.id); deleteDoc("categories", el.dataset.id); render();
    });
  }
  else if(action==="addCatItem"){ addCatItem(el.dataset.cat); }
  else if(action==="deleteCatItem"){
    confirmAction(t("deleteItemConfirm"), ()=>{
      const it = catItems[el.dataset.id]; const c = it ? categories[it.categoryId] : null;
      if(c) logActivity(t("activityCatItemDeleted").replace("{name}", loc(c,"name")));
      deleteDoc("catItems", el.dataset.id); render();
    });
  }
  else if(action==="addSchedule"){ openAddScheduleModal(); }
  else if(action==="pickSchedule"){ activeScheduleId = el.dataset.id; render(); }
  else if(action==="stepScheduleDate"){
    const next = stepSessionDate(scheduleDate, parseInt(el.dataset.dir,10));
    if(next){ scheduleDate = next; activeScheduleId = null; render(); }
  }
  else if(action==="stepAttendanceDate"){
    const next = stepSessionDate(attendanceDate, parseInt(el.dataset.dir,10));
    if(next){ attendanceDate = next; attendanceHeatmapMonth = attendanceDate.slice(0,7); render(); }
  }
  else if(action==="deleteSchedule"){
    confirmAction(t("deleteScheduleConfirm"), ()=>{
      const sc = schedules[el.dataset.id];
      if(sc) logActivity(t("activityScheduleDeleted").replace("{date}", formatSessionDate(sc.date)));
      deleteWhere("scheduleBlocks","scheduleId", el.dataset.id); deleteDoc("schedules", el.dataset.id); activeScheduleId = null; render();

  }
  else if(action==="openBlockModal"){ openBlockModal(el.dataset.id || null); }
  else if(action==="setScheduleViewMode"){
    scheduleViewMode = el.dataset.mode;
    try{ localStorage.setItem("araratian_sched_view", scheduleViewMode); }catch(err){}
    render();
  }
  else if(action==="moveBlockInList"){ moveBlockInList(el.dataset.block, parseInt(el.dataset.dir,10)); }
  else if(action==="toggleBlockSelection"){ toggleBlockSelection(el.dataset.block); }
  else if(action==="clearBlockSelection"){ clearBlockSelection(); }
  else if(action==="bulkDeleteBlocks"){ bulkDeleteBlocks(); }
  else if(action==="bulkRecolorBlocks"){ bulkRecolorBlocks(el.dataset.color); }
  else if(action==="deleteBlockFromList"){
    const b = scheduleBlocks[el.dataset.block]; if(!b) return;
    confirmAction(t("deleteBlockConfirm"), ()=>{

      deleteDoc("scheduleBlocks", b.id); render();

  }

  else if(action==="toggleSchedSourceGroup"){
    const key = el.dataset.group;
    openSchedSourceGroups.has(key) ? openSchedSourceGroups.delete(key) : openSchedSourceGroups.add(key);

  else if(action==="setAttendance"){

      awardAttendanceAutoPoint(el.dataset.id, attendanceDate, newStatus);

  }
  else if(action==="markAllPresent"){
    const doIt = ()=>{
      sortedScouts().forEach(s=>{
        upsertDoc("attendance", attendanceDate+"__"+s.id, {date: attendanceDate, scoutId: s.id, status: "present", updatedBy: EDITOR_NAME||null, updatedAt: new Date().toISOString()});
        awardAttendanceAutoPoint(s.id, attendanceDate, "present");
      });

    const hasExisting = sortedScouts().some(s=> attendance[attendanceDate+"__"+s.id]);

  else if(action==="exportRosterCsv"){ exportRosterCsv(); }

/* =========================== SCHEDULE TEMPLATES =========================== */
function openSaveTemplateModal(){
  const root = document.getElementById("modalRoot");
  root.classList.remove("hidden");
  root.innerHTML = `
  <div class="modal">
    <h3>${esc(t("saveAsTemplate"))}</h3>
    <div class="field"><label>${esc(t("templateNamePrompt"))}</label><input type="text" id="tplNameInput" autofocus /></div>
    <div class="modal-actions">
      <button class="btn" data-action="closeModal">${esc(t("cancel"))}</button>
      <button class="btn primary" data-action="confirmSaveTemplate">${esc(t("save"))}</button>
    </div>
  </div>`;
  root.querySelector("[data-action='closeModal']").addEventListener("click", closeModal);
  root.addEventListener("click", (e)=>{ if(e.target===root) closeModal(); });
  root.querySelector("[data-action='confirmSaveTemplate']").addEventListener("click", ()=>{
    const name = document.getElementById("tplNameInput").value.trim();
    if(!name) return;
    saveScheduleAsTemplate(name);
    closeModal();
  });
}
function saveScheduleAsTemplate(name){
  if(!activeScheduleId) return;
  const blocks = blocksForSchedule(activeScheduleId).map(b=>({
    title: b.title, color: b.color, sourceType: b.sourceType, sourceId: b.sourceId,
    startMin: b.startMin, durationMin: b.durationMin, notes: b.notes,
  }));
  const list = sortedScheduleTemplates();
  const nextOrder = list.length ? Math.max(...list.map(x=>x.order||0))+1 : 1;
  const id = "tpl_" + Date.now().toString(36);
  upsertDoc("scheduleTemplates", id, { id, order: nextOrder, name, blocks });
  logActivity(t("activityTemplateSaved").replace("{name}", name));
}
function applyScheduleTemplate(templateId){
  const tpl = scheduleTemplates[templateId];
  if(!tpl || !activeScheduleId) return;
  logActivity(t("activityTemplateApplied").replace("{name}", tpl.name));
  (tpl.blocks||[]).forEach((b, i)=>{
    const id = "blk_" + Date.now().toString(36) + "_" + i + Math.random().toString(36).slice(2,5);
    upsertDoc("scheduleBlocks", id, {
      id, scheduleId: activeScheduleId, title: b.title, color: b.color,
      sourceType: b.sourceType, sourceId: b.sourceId, startMin: b.startMin,
      durationMin: b.durationMin, notes: b.notes,
    });
  });
  render();
}

function addTopic(rankId){
  const list = topicsForRank(rankId);
  const nextOrder = list.length ? Math.max(...list.map(x=>x.order||0))+1 : 1;

function addBlockFromSource(kind, sourceId, startOverride){
  if(!activeScheduleId) return;
  let title = "", color = "#0C3953";
  if(kind==="rank"){
    const tp = topics[sourceId]; if(!tp) return;
    title = loc(tp, "title"); const r = ranks[tp.rankId]; color = (r&&r.color)||color;
  } else {
    const it = catItems[sourceId]; if(!it) return;
    title = loc(it, "title"); const c = categories[it.categoryId]; color = (c&&c.color)||color;
  }
  let start;
  if(startOverride!=null){
    start = Math.round(Math.max(DAY_START, Math.min(DAY_END-30, startOverride))/5)*5;
  } else {
    const existing = blocksForSchedule(activeScheduleId);
    start = DAY_START;
    if(existing.length){ const last = existing[existing.length-1]; start = Math.min(DAY_END-30, last.startMin+last.durationMin); }
  }
  const id = "blk_" + Date.now().toString(36);
  upsertDoc("scheduleBlocks", id, {
    id, scheduleId: activeScheduleId, title, color, sourceType: kind, sourceId,
    startMin: start, durationMin: 30, notes: "",
  });
  logActivity(t("activityBlockAdded").replace("{title}", title));
  render();
}
function addCustomBlockAt(startMin, durationMin){
  if(!activeScheduleId) return null;
  const dur = Math.max(5, Math.round(durationMin));
  const start = Math.round(Math.max(DAY_START, Math.min(DAY_END-dur, startMin))/5)*5;
  const id = "blk_" + Date.now().toString(36);
  const title = t("newBlockDefaultTitle");
  upsertDoc("scheduleBlocks", id, {
    id, scheduleId: activeScheduleId, title, color: CATEGORY_SWATCHES[0],
    sourceType: "custom", sourceId: null, startMin: start, durationMin: dur, notes: "",
  });
  logActivity(t("activityBlockAdded").replace("{title}", title));
  return id;
}
/* Touch's equivalent of the desktop drag-to-create gesture: instead of
   dragging out a duration by hand (unusable on a touchscreen -- see the
   pointerdown handler in bindTimelineDrag), a tap creates a real 30-minute
   block right away at that time and opens it for editing, so duration/title/
   color are all set through the modal's normal fields instead of a gesture. */
function openAddBlockModalAt(startMin){
  if(!activeScheduleId) return;
  const id = addCustomBlockAt(startMin, 30);
  if(id){ render(); openBlockModal(id); }
}

/* Reordering in list view swaps the two blocks' start times (each keeps its
   own duration) rather than trying to re-flow the whole day -- the simplest
   rule that does what "move this one up/down" visibly looks like, without
   silently resizing anything. Since nothing in this app enforces blocks not
   to overlap (the timeline itself allows overlapping drags today), a swap
   that happens to overlap an adjacent block is no different from what
   dragging already permits. */
function moveBlockInList(blockId, dir){
  const b = scheduleBlocks[blockId];
  if(!b) return;
  const list = blocksForSchedule(b.scheduleId);
  const idx = list.findIndex(x=>x.id===blockId);
  const swapIdx = idx + dir;
  if(idx<0 || swapIdx<0 || swapIdx>=list.length) return;
  const other = list[swapIdx];
  const aStart = b.startMin, bStart = other.startMin;
  mergeDoc("scheduleBlocks", b.id, {startMin: bStart});
  mergeDoc("scheduleBlocks", other.id, {startMin: aStart});
  render();
}
